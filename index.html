<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quran App with Salah Times</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Trigger Button -->
  <button 
    onclick="toggleSalahModal(true)" 
    class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-xl shadow-lg transition flex items-center gap-2">
    <span>🕌</span> 65 Musalla Live Schedule
  </button>

  <!-- 65 MUSALLA MODAL -->
  <div id="salahModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl w-full max-w-md flex flex-col relative shadow-2xl overflow-hidden">
      
      <!-- Modal Header -->
      <div class="p-4 bg-emerald-600 text-white flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <span class="text-2xl">🕌</span>
          <div>
            <h3 class="font-bold text-base leading-tight">65 Musalla</h3>
            <p class="text-[11px] opacity-80">Thorncliffe Park Drive, Toronto</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <a href="https://65musalla.com" target="_blank" rel="noopener" class="text-xs bg-white/20 hover:bg-white/30 px-2.5 py-1 rounded-lg transition font-medium">
            Live Site ↗
          </a>
          <button onclick="toggleSalahModal(false)" class="text-white/80 hover:text-white text-xl font-bold px-2 py-0.5 rounded-lg hover:bg-white/10 transition">✕</button>
        </div>
      </div>

      <!-- Modal Body -->
      <div class="p-5 space-y-4">
        <div class="text-center pb-2 border-b border-gray-100 dark:border-gray-800">
          <p id="salahDate" class="text-xs text-emerald-600 dark:text-emerald-400 font-semibold tracking-wide">Loading Date...</p>
        </div>

        <!-- Dynamic Prayer List Container -->
        <div id="salahList" class="space-y-2">
          <!-- Loading Spinner -->
          <div id="salahLoading" class="text-center py-8 text-gray-400 text-sm flex flex-col items-center gap-2">
            <div class="w-6 h-6 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
            Fetching prayer times...
          </div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="px-5 py-3 bg-gray-50 dark:bg-gray-800/40 border-t border-gray-100 dark:border-gray-800 flex items-center justify-between text-[11px] text-gray-500 dark:text-gray-400">
        <span>Method: ISNA (North America)</span>
        <button onclick="fetchSalahTimes()" class="text-emerald-600 dark:text-emerald-400 font-semibold hover:underline">
          🔄 Refresh
        </button>
      </div>

    </div>
  </div>

  <script>
    // Toggle Modal State
    function toggleSalahModal(show) {
      const modal = document.getElementById("salahModal");
      if (show) {
        modal.classList.remove("hidden");
        fetchSalahTimes();
      } else {
        modal.classList.add("hidden");
      }
    }

    // Helper: Convert 24h Time (HH:MM) to 12h AM/PM
    function format12h(timeStr) {
      if (!timeStr) return "--:--";
      const [h, m] = timeStr.split(":");
      let hours = parseInt(h, 10);
      const suffix = hours >= 12 ? "PM" : "AM";
      hours = hours % 12 || 12;
      return `${hours}:${m} ${suffix}`;
    }

    // Fetch Daily Prayer Times for 65 Musalla Coordinates (Toronto)
    async function fetchSalahTimes() {
      const container = document.getElementById("salahList");
      const dateElem = document.getElementById("salahDate");
      
      // Toronto Coordinates (Thorncliffe Park Area)
      const lat = 43.7056;
      const lng = -79.3486;

      try {
        const response = await fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lng}&method=2`);
        const result = await response.json();

        if (result.code !== 200) throw new Error("Failed to fetch");

        const timings = result.data.timings;
        const dateObj = result.data.date;

        // Display Header Date
        dateElem.innerText = `${dateObj.readable} | ${dateObj.hijri.day} ${dateObj.hijri.month.en} ${dateObj.hijri.year} AH`;

        // Render Cards
        const prayers = [
          { name: "Fajr", adhan: timings.Fajr, iqamah: "5:30 AM" },
          { name: "Dhuhr", adhan: timings.Dhuhr, iqamah: "1:45 PM" },
          { name: "Asr", adhan: timings.Asr, iqamah: "6:45 PM" },
          { name: "Maghrib", adhan: timings.Maghrib, iqamah: "Sunset + 5m" },
          { name: "Isha", adhan: timings.Isha, iqamah: "10:00 PM" },
          { name: "Jumu'ah", adhan: "1:22 PM", iqamah: "1:45 PM", isJumah: true }
        ];

        container.innerHTML = prayers.map(p => `
          <div class="flex items-center justify-between p-3 rounded-xl ${p.isJumah ? 'bg-emerald-500/10 border border-emerald-500/30' : 'bg-gray-100 dark:bg-gray-800/60 border border-gray-200 dark:border-gray-700/50'}">
            <span class="font-bold text-sm ${p.isJumah ? 'text-emerald-600 dark:text-emerald-400' : 'text-gray-800 dark:text-gray-200'}">${p.name}</span>
            <div class="text-right text-xs space-x-3">
              <span class="text-gray-500 dark:text-gray-400">Begins: <strong class="text-gray-700 dark:text-gray-300">${p.isJumah ? p.adhan : format12h(p.adhan)}</strong></span>
              <span class="text-emerald-600 dark:text-emerald-400 font-bold">Iqamah: ${p.iqamah}</span>
            </div>
          </div>
        `).join("");

      } catch (err) {
        container.innerHTML = `
          <div class="text-center py-6 text-red-500 text-xs">
            Unable to load live prayer times.<br>
            <a href="https://65musalla.com" target="_blank" class="underline mt-2 inline-block font-semibold">View on 65musalla.com</a>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
