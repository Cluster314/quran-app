<!DOCTYPE html>
<html lang="ar" class="dark">
<head>

  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="favicon.ico" />
  <link rel="canonical" href="https://cluster314.github.io/quran-app/" />

  <!-- Open Graph & Twitter -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="The Noble Quran - Indo-Pak Reader" />
  <meta property="og:description" content="Read and listen to the Noble Quran in 15-line Indo-Pak script with translations and word tooltips." />
  <meta name="theme-color" content="#40bfff" id="metaThemeColor" />

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Scheherazade+New:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'IndoPakQuran';
      src: url('indopakfont.ttf') format('truetype');
      font-display: swap;
    }

    :root[data-theme="dark"] {
      --bg-body: #0f172a;
      --bg-header: rgba(15, 23, 42, 0.95);
      --bg-card: #1e293b;
      --bg-inner: #0f172a;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-arabic: #f8fafc;
      --scrollbar-thumb: #475569;
      --card-glow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 0 12px var(--accent-subtle);
    }

    :root[data-theme="light"] {
      --bg-body: #f1f5f9;
      --bg-header: rgba(255, 255, 255, 0.95);
      --bg-card: #ffffff;
      --bg-inner: #f8fafc;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-arabic: #0f172a;
      --scrollbar-thumb: #cbd5e1;
      --card-glow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 0 10px var(--accent-subtle);
    }

    :root[data-theme="sepia"] {
      --bg-body: #f4ebd9;
      --bg-header: rgba(237, 224, 203, 0.95);
      --bg-card: #eadeca;
      --bg-inner: #e2d4be;
      --border-color: #d3c4a8;
      --text-main: #433422;
      --text-muted: #78644c;
      --text-arabic: #2d2013;
      --scrollbar-thumb: #c4b396;
      --card-glow: 0 4px 6px -1px rgba(67, 52, 34, 0.08), 0 0 10px var(--accent-subtle);
    }

    :root[data-theme="oled"] {
      --bg-body: #000000;
      --bg-header: rgba(0, 0, 0, 0.95);
      --bg-card: #040406;
      --bg-inner: #000000;
      --border-color: #162032;
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --text-arabic: #ffffff;
      --scrollbar-thumb: #1e293b;
      --card-glow: 0 0 25px var(--accent-glow), inset 0 0 15px var(--accent-glow), 0 0 50px rgba(0, 0, 0, 0.9);
    }

    html, body { max-width: 100vw; overflow-x: hidden; }
    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
      background-attachment: fixed;
      -webkit-tap-highlight-color: transparent;
    }

    .theme-header { 
      background-color: var(--bg-header); 
      border-color: var(--accent-subtle); 
      border-bottom-width: 2px;
      backdrop-filter: blur(12px); 
    }
    
    :root[data-theme="oled"] .theme-header {
      box-shadow: 0 4px 30px var(--accent-glow);
    }

    .theme-card { 
      background-color: var(--bg-card); 
      border-color: var(--accent-subtle); 
      box-shadow: var(--card-glow);
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .theme-card:hover {
      border-color: var(--accent);
    }

    :root[data-theme="oled"] .theme-card {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow), inset 0 0 10px var(--accent-glow);
    }

    .theme-inner { background-color: var(--bg-inner); border-color: var(--accent-subtle); }
    .theme-text-muted { color: var(--text-muted); }
    .theme-accent-text { color: var(--accent); }

    :root[data-theme="oled"] .theme-accent-text {
      text-shadow: 0 0 12px var(--accent);
    }

    .mushaf-page-box {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      background-color: transparent;
      border: none;
      box-shadow: none;
      padding: 5px 0;
    }

    .mushaf-line {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px 8px;
      border-radius: 6px;
      min-height: 38px;
    }

    .line-content {
      font-family: 'IndoPakQuran', 'Scheherazade New', 'Amiri', serif;
      font-size: 24px;
      line-height: 1.4;
      width: 100%;
      text-align: center;
      word-spacing: 2px;
      color: var(--text-arabic);
    }

    .line-content.surah-header {
      background: var(--accent-glow);
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: var(--accent);
      font-weight: bold;
      font-size: 18px;
      padding: 4px;
      margin: 2px 0;
      text-align: center;
    }

    .indopak-ayah-text {
      font-family: 'IndoPakQuran', 'Scheherazade New', 'Amiri', serif;
      direction: rtl;
      text-align: right;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg-body); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
    .scrollbar-none::-webkit-scrollbar { display: none; }

    .toggle-btn {
      padding: 3px 8px;
      border-radius: 10px;
      border: 1px solid var(--accent-subtle);
      background-color: var(--bg-inner);
      cursor: pointer;
      font-weight: bold;
      font-size: 0.7rem;
      color: var(--text-muted);
    }
    .toggle-btn.finite {
      background-color: var(--accent);
      color: var(--accent-contrast);
      border-color: var(--accent);
    }
    .active-ayah-playing {
      outline: 2px solid var(--accent) !important;
      border-radius: 1rem;
      box-shadow: 0 0 35px var(--accent-glow) !important;
    }
    .custom-btn-primary { background-color: var(--accent); color: var(--accent-contrast); }
    .custom-btn-primary:hover { opacity: 0.9; }
    .active-tab-btn { border-color: var(--accent) !important; background-color: var(--accent); color: var(--accent-contrast) !important; }
  </style>
</head>
<body class="font-sans min-h-screen flex flex-col pb-20 max-w-full overflow-x-hidden">

  <script>
    /* =========================================================
       INDEXEDDB CACHING ENGINE
       ========================================================= */
    class QuranCacheDB {
      constructor() {
        this.dbName = "QuranIndoPakCache";
        this.version = 3; // Bumped to 3 to ensure indopak_nastaleeq store exists
        this.db = null;
      }

      async init() {
        if (this.db) return this.db;
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(this.dbName, this.version);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains("translations")) {
              db.createObjectStore("translations");
            }
            if (!db.objectStoreNames.contains("indopak_nastaleeq")) {
              db.createObjectStore("indopak_nastaleeq");
            }
          };
          req.onsuccess = (e) => {
            this.db = e.target.result;
            resolve(this.db);
          };
          req.onerror = (e) => reject(e.target.error);
        });
      }

      async get(storeName, key) {
        await this.init();
        return new Promise((resolve) => {
          const tx = this.db.transaction(storeName, "readonly");
          const req = tx.objectStore(storeName).get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      }

      async set(storeName, key, value) {
        await this.init();
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(storeName, "readwrite");
          const req = tx.objectStore(storeName).put(value, key);
          req.onsuccess = () => resolve(true);
          req.onerror = (e) => reject(e.target.error);
        });
      }
    }

    function getContrastTextColor(hexColor) {
      let r = parseInt(hexColor.slice(1, 3), 16) || 64;
      let g = parseInt(hexColor.slice(3, 5), 16) || 191;
      let b = parseInt(hexColor.slice(5, 7), 16) || 255;
      let brightness = (r * 299 + g * 587 + b * 114) / 1000;
      return brightness >= 130 ? '#0f172a' : '#ffffff';
    }

    function playSelectedAudioRange() {
      const fromS = parseInt(document.getElementById("audioStartSurahSelect").value);
      const fromA = parseInt(document.getElementById("audioStartAyahInput").value) || 1;
      const toS = parseInt(document.getElementById("audioEndSurahSelect").value) || fromS;
      const toA = parseInt(document.getElementById("audioEndAyahInput").value) || 1;

      if (!fromS) { alert("Please select a starting Surah."); return; }

      let audioRangeList = [];
      let previousSurah = null;

      for (let sId = fromS; sId <= toS; sId++) {
        const meta = chaptersData.find(c => c.id === sId);
        if (!meta) continue;
        let startFilter = (sId === fromS) ? fromA : 1;
        let endFilter = (sId === toS) ? toA : meta.verses_count;

        for (let aNum = startFilter; aNum <= endFilter; aNum++) {
          if (previousSurah !== null && sId !== previousSurah && sId !== 1 && sId !== 9) {
            audioRangeList.push({ verse_key: "1:1", isBismillah: true });
          }
          audioRangeList.push({ verse_key: `${sId}:${aNum}` });
          previousSurah = sId;
        }
      }

      if (audioRangeList.length === 0) return;
      stopAudioPlayback();
      currentLoadedVerses = audioRangeList;
      currentAudioIndex = 0;
      currentAyahRepeatCount = 0;
      currentRangeRepeatCount = 0;
      playAudioIndex(0);
      toggleAudioModal(true);
    }

    async function playAudioIndex(index) {
      if (!currentLoadedVerses || index < 0 || index >= currentLoadedVerses.length) {
        handleRangeEnd();
        return;
      }

      currentAudioIndex = index;
      const item = currentLoadedVerses[index];
      const verseKey = item.verse_key;
      
      if (!item.isBismillah) {
        highlightPlayingAyah(verseKey);
      } else {
        highlightPlayingAyah(null);
      }

      const config = getRepeatConfig();
      const repeatLabel = item.isBismillah ? "Bismillah" : (config.ayahRepeat === Infinity ? "∞" : `${currentAyahRepeatCount + 1}/${config.ayahRepeat}`);

      updatePlayerUI(true, item.isBismillah ? "Reciting Bismillah..." : `Loading ${verseKey}...`, `Ayah ${repeatLabel}`);
      
      const targetVerse = item.isBismillah ? "1:1" : verseKey;
      const url = getEveryAyahUrl(targetVerse, selectedEveryAyahQari);

      const speedSelect = document.getElementById("playbackSpeedSelect");
      const currentSpeed = parseFloat(speedSelect ? speedSelect.value : 1.0) || 1.0;

      if (index + 1 < currentLoadedVerses.length) {
        const nextItem = currentLoadedVerses[index + 1];
        const nextVerseKey = nextItem.isBismillah ? "1:1" : nextItem.verse_key;
        nextAudioObject.src = getEveryAyahUrl(nextVerseKey, selectedEveryAyahQari);
        nextAudioObject.playbackRate = currentSpeed;
        nextAudioObject.load();
      }

      audioObject.src = url;
      audioObject.playbackRate = currentSpeed;

      audioObject.play().then(() => {
        isPlayingAudio = true;
        updatePlayerUI(true, item.isBismillah ? "Reciting Bismillah" : `Playing ${verseKey}`, `Ayah ${repeatLabel}`);
      }).catch(err => {
        console.error("Audio error:", err);
        updatePlayerUI(false, "Error", "Playback failed");
      });
    }

    audioObject.onended = () => {
      const item = currentLoadedVerses[currentAudioIndex];
      if (item && item.isBismillah) {
        currentAudioIndex++;
        if (currentAudioIndex < currentLoadedVerses.length) {
          playAudioIndex(currentAudioIndex);
        } else {
          handleRangeEnd();
        }
        return;
      }

      const config = getRepeatConfig();
      currentAyahRepeatCount++;
      if (currentAyahRepeatCount < config.ayahRepeat) {
        playAudioIndex(currentAudioIndex);
      } else {
        currentAyahRepeatCount = 0;
        currentAudioIndex++;
        if (currentAudioIndex < currentLoadedVerses.length) {
          playAudioIndex(currentAudioIndex);
        } else {
          handleRangeEnd();
        }
      }
    };

    function handleRangeEnd() {
      const config = getRepeatConfig();
      currentRangeRepeatCount++;
      if (currentRangeRepeatCount < config.rangeRepeat) {
        currentAudioIndex = 0;

        playAudioIndex(0);

        stopAudioPlayback();
      }
    }

    function initScrollObserver() {
      if (scrollObserver) scrollObserver.disconnect();
      scrollObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const verseKey = entry.target.getAttribute('data-verse-key');
            if (verseKey) {
              lastActiveVerseKey = verseKey;
              const currentPath = window.location.hash.replace('#', '').split('?')[0];
              localStorage.setItem(`last_verse_${currentPath}`, verseKey);
            }
          }
        });
      }, { rootMargin: '-10% 0px -70% 0px', threshold: 0 });

      document.querySelectorAll('[data-verse-key]').forEach(el => scrollObserver.observe(el));
    }

    function restoreScrollPosition() {

    async function loadPageMap() {
      try {
        const res = await fetch("final_610_quran_page_map.json");
        if (!res.ok) throw new Error(`HTTP status ${res.status}`);
        const data = await res.json();
        
        const map = {};
        const revMap = {};
        let totalPages = 0;

        Object.keys(data).forEach(pageStr => {
          const pNum = parseInt(pageStr);
          if (!isNaN(pNum)) {
            const pageObj = data[pageStr];
            const sSurah = pageObj.starting_surah || pageObj.start_surah || 1;
            const sAyah = pageObj.starting_ayah || pageObj.start_ayah || 1;
            map[pNum] = [sSurah, sAyah];
            revMap[`${sSurah}:${sAyah}`] = pNum;
            if (pNum > totalPages) totalPages = pNum;
          }
        });

        INDOPAK_15_LINE_PAGE_STARTS = map;
        REVERSE_PAGE_LOOKUP = revMap;
        if (totalPages > 0) MAX_PAGES = totalPages;
        populateDropdowns();
      } catch (err) {
        INDOPAK_15_LINE_PAGE_STARTS = { 1: [1, 1] };
        REVERSE_PAGE_LOOKUP = { "1:1": 1 };
        populateDropdowns();
      }
    }

    async function fetchIndoPakVersesFromApi(surahId) {
      if (indopakApiVersesCache[surahId]) return indopakApiVersesCache[surahId];
      const cached = await quranCache.get("indopak_nastaleeq", surahId);
      if (cached) {
        indopakApiVersesCache[surahId] = cached;
        return cached;
      }

      try {
        const res = await fetch(`${API_BASE}/quran/verses/indopak_nastaleeq?chapter_number=${surahId}`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        const verses = data.verses || [];
        indopakApiVersesCache[surahId] = verses;
        await quranCache.set("indopak_nastaleeq", surahId, verses);
        return verses;
      } catch (err) {
        return [];
      }
    }

      displayMode = newMode;

      const [pathPart, queryPart] = rawHash.split('?');
      const params = new URLSearchParams(queryPart || '');
      params.set('mode', newMode);
      window.location.hash = `#${pathPart}?${params.toString()}`;
    }

    function navigate(path) {
      lastActiveVerseKey = null;
      const cleanPath = path.startsWith('/') ? path : '/' + path;
      const [pathPart, queryPart] = cleanPath.split('?');
      const params = new URLSearchParams(queryPart || '');
      if (displayMode && displayMode !== 'verse') params.set('mode', displayMode);
      const queryString = params.toString();
      window.location.hash = queryString ? `${pathPart}?${queryString}` : pathPart;
    }

    window.addEventListener("hashchange", () => router());

    async function router() {
      const app = document.getElementById("app");
      try {
        const rawHash = window.location.hash.replace('#', '') || '/';
        const [hash, queryPart] = rawHash.split('?');
        const urlParams = new URLSearchParams(queryPart || '');

        if (urlParams.has('mode')) displayMode = urlParams.get('mode');
        document.getElementById("displayModeSelect").value = displayMode;

        if (chaptersData.length === 0) await loadChapters();
        if (Object.keys(INDOPAK_15_LINE_PAGE_STARTS).length === 0) await loadPageMap();
        if (!qudratullahDictData) await loadQudratullahDict();
        populateEveryAyahQariDropdown();

        resetNavControls();

        if (hash === "/" || hash === "") {
          setNavMode('surah');
          renderHome();
        } else if (hash.startsWith("/juz/")) {
          setNavMode('juz');
          const juzId = parseInt(hash.split("/")[2]);
          if (juzId >= 1 && juzId <= 30) {
            document.getElementById("juzSelect").value = juzId;
            await renderJuz(juzId);
          } else { render404(); }
        } else if (hash.startsWith("/page/")) {
          setNavMode('page');
          const pageNum = parseInt(hash.split("/")[2]);
          if (pageNum >= 1 && pageNum <= MAX_PAGES) {
            document.getElementById("pageSelect").value = pageNum;
            await renderPage(pageNum);
          } else { render404(); }
        } else if (hash.includes("-")) {
          setNavMode('range');
          const cleanHash = hash.startsWith('/') ? hash.slice(1) : hash;
          const [startPart, endPart] = cleanHash.split("-");
          const [fromS, fromA] = startPart.split(":").map(Number);
          
          let toS, toA;
          if (endPart.includes(":")) {
            [toS, toA] = endPart.split(":").map(Number);
          } else {
            toS = fromS;
            toA = Number(endPart);
          }

          document.getElementById("startSurahSelect").value = fromS;
          document.getElementById("startAyahInput").value = fromA;
          document.getElementById("endSurahSelect").value = toS;
          document.getElementById("endAyahInput").value = toA;

          await renderCrossSurahRange(fromS, fromA, toS, toA);
        } else {
          const parts = hash.split("/").filter(Boolean);
          const id = parseInt(parts[0]);
          if (!isNaN(id) && id >= 1 && id <= 114) {
            const ayahNum = parts[1] ? parseInt(parts[1]) : null;
            if (ayahNum) {
              setNavMode('singleAyah');
              document.getElementById("singleSurahSelect").value = id;
              document.getElementById("singleAyahInput").value = ayahNum;
              await renderCrossSurahRange(id, ayahNum, id, ayahNum, `Surah ${id}:${ayahNum}`);
            } else {
              setNavMode('surah');
              document.getElementById("surahSelect").value = id;
              await renderSurah(id);
            }
          } else { renderHome(); }
        }
      } catch (err) {
        console.error("Routing error:", err);
        app.innerHTML = `<div class="text-center py-20 text-red-400"><h2 class="text-xl font-bold mb-2">Error Loading Page</h2><p class="text-sm theme-text-muted">${err.message}</p></div>`;
      }
    }

    function setNavMode(mode) {
      ['surah', 'juz', 'page', 'range', 'singleAyah'].forEach(m => {
        const tab = document.getElementById(`tab${m.charAt(0).toUpperCase() + m.slice(1)}`);
        const ctrl = document.getElementById(`controls${m.charAt(0).toUpperCase() + m.slice(1)}`);
        if (m === mode) {
          if (tab) tab.className = "px-2.5 py-1 rounded-md border active-tab-btn font-semibold whitespace-nowrap transition shrink-0";
          if (ctrl) { ctrl.classList.remove("hidden"); ctrl.classList.add("flex"); }
        } else {
          if (tab) tab.className = "px-2.5 py-1 rounded-md border theme-card theme-text-muted whitespace-nowrap transition shrink-0";
          if (ctrl) { ctrl.classList.add("hidden"); ctrl.classList.remove("flex"); }
        }
      });
    }

    async function loadChapters() {
      try {
        const res = await fetch(`${API_BASE}/chapters?language=en`);
        if (!res.ok) throw new Error("API failed");
        const data = await res.json();
        chaptersData = data.chapters.map(c => ({

          verses_count: c.verses_count,

          {id: 2, name_simple: "Al-Baqarah", name_arabic: "البقرة", verses_count: 286, translated_name: {name: "The Cow"}}

        for(let i=3; i<=114; i++) chaptersData.push({id: i, name_simple: `Surah ${i}`, name_arabic: `سورة ${i}`, verses_count: 50, translated_name: {name: `Surah ${i}`}});

    async function fetchSurahTranslation(surahId) {
      if (translationCache[surahId]) return translationCache[surahId];
      
      const cached = await quranCache.get("translations", surahId);
      if (cached) {
        translationCache[surahId] = cached;
        return cached;
      }

      try {
        const res = await fetch(`${TRANSLATION_BASE}/${surahId}.json`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        const map = {};
        if (Array.isArray(data)) {
          data.forEach(item => {
            if (Array.isArray(item) && item.length >= 2 && typeof item[0] === 'number') {
              map[item[0]] = Array.isArray(item[1]) ? item[1].join(' ') : String(item[1]);
            } else if (typeof item === 'object' && item !== null) {
              const num = item.ayah || item.verse || item.id;
              const text = item.text || item.translation;
              if (num && text) map[num] = String(text);
            }
          });
        }
        translationCache[surahId] = map;
        await quranCache.set("translations", surahId, map);
        return map;
      } catch (err) { return {}; }
    }

    function getPagesForRange(fromS, fromA, toS, toA) {
      let startP = 1, endP = MAX_PAGES;
      for (let p = 1; p <= MAX_PAGES; p++) {
        const s = INDOPAK_15_LINE_PAGE_STARTS[p];
        if (s && (s[0] < fromS || (s[0] === fromS && s[1] <= fromA))) startP = p;
        if (s && (s[0] < toS || (s[0] === toS && s[1] <= toA))) endP = p;
      }
      let pages = [];
      for (let p = startP; p <= endP; p++) pages.push(p);
      return pages;
    }

    async function renderMushafModeForRange(fromS, fromA, toS, toA) {
      const pageNumbers = getPagesForRange(fromS, fromA, toS, toA);
      return await renderMushafModeForPages(pageNumbers, null, null, {fromS, fromA, toS, toA});
    }

    async function renderVerseByVerseMode(fromS, fromA, toS, toA, preloadedTranslations = null) {
      let cardsHtml = "";
      
      for (let sId = fromS; sId <= toS; sId++) {
        const verses = await fetchIndoPakVersesFromApi(sId);
        let trans = preloadedTranslations;
        if (!trans || sId !== fromS) trans = await fetchSurahTranslation(sId);

        let startFilter = (sId === fromS) ? fromA : 1;
        let endFilter = (sId === toS) ? toA : verses.length;

        for (let v of verses) {
          const vKey = v.verse_key || `${sId}:${v.verse_number || 1}`;
          const [vSurah, vAyah] = vKey.split(":").map(Number);
          if (vSurah === sId && vAyah >= startFilter && vAyah <= endFilter) {
            let translatedText = trans ? trans[vAyah] || "" : "";
            const arabicText = v.text_indopak || v.text || v.text_uthmani || "";
            
            const fullTextToCopy = `${arabicText}\n\n${translatedText}`;
            const encodedCopyText = encodeURIComponent(fullTextToCopy);

            cardsHtml += `
              <div id="verse-${vKey}" data-verse-key="${vKey}" class="w-full theme-card border rounded-xl p-3 sm:p-6 flex flex-col space-y-3 mb-4">
                <div class="flex items-center justify-between border-b theme-inner pb-2">
                  <span class="px-2 py-0.5 theme-inner border border-opacity-30 theme-accent-text text-3xs sm:text-2xs font-semibold rounded-full" style="border-color: var(--accent);">${vKey}</span>
                  <div class="flex flex-wrap items-center gap-1">
                    <button onclick="playSingleVerse('${vKey}')" class="text-3xs sm:text-2xs theme-card hover:bg-[var(--accent)] hover:text-[var(--accent-contrast)] px-2 py-1 rounded border border-opacity-40 theme-accent-text font-semibold transition" style="border-color: var(--accent);">▶ Play</button>
                    <button onclick="setAudioStartVerse('${vKey}')" class="text-3xs sm:text-2xs theme-card hover:bg-[var(--accent)] hover:text-[var(--accent-contrast)] px-1.5 py-1 rounded border border-opacity-40 theme-accent-text font-semibold transition" style="border-color: var(--accent);" title="Start">📍</button>
                    <button onclick="setAudioEndVerse('${vKey}')" class="text-3xs sm:text-2xs theme-card hover:bg-[var(--accent)] hover:text-[var(--accent-contrast)] px-1.5 py-1 rounded border border-opacity-40 theme-accent-text font-semibold transition" style="border-color: var(--accent);" title="End">🏁</button>
                    <button onclick="copyVerseText('${encodedCopyText}')" class="text-3xs sm:text-2xs theme-card hover:bg-[var(--accent)] hover:text-[var(--accent-contrast)] px-2 py-1 rounded border border-opacity-40 theme-accent-text font-semibold transition" style="border-color: var(--accent);">📋</button>
                  </div>
                </div>
                <div class="indopak-ayah-text text-2xl sm:text-3xl px-1 pt-1 leading-relaxed" style="display: block; unicode-bidi: isolate;" dir="rtl">${arabicText}</div>
                ${translatedText ? `<div class="text-left text-xs sm:text-sm border-t theme-inner pt-2.5 mt-1 leading-relaxed">${translatedText}</div>` : ''}
              </div>
            `;
          }
        }
      }

      return `<div class="w-full space-y-4">${cardsHtml}</div>`;
    }

    function renderTranslationOnlyMode(surahId, startAyah, endAyah, translations) {
      let items = [];
      for (let a = startAyah; a <= endAyah; a++) {
        const verseKey = `${surahId}:${a}`;
        let translatedText = (translations && translations[a]) ? String(translations[a]) : "";
        if (translatedText) {
          items.push(`<p id="verse-${verseKey}" data-verse-key="${verseKey}"><strong class="theme-accent-text">[${verseKey}]</strong> ${translatedText}</p>`);
        }
      }
      return `<div class="w-full theme-card border rounded-2xl p-4 sm:p-6 my-4"><div class="text-left text-xs sm:text-sm leading-relaxed space-y-2.5">${items.join("")}</div></div>`;
    }

    async function renderMushafModeForPages(pageNumbers, currentPageNum = null, title = null, rangeFilter = null, asVerseList = false, preloadedTranslations = null) {
      const qudratullahData = await loadQudratullahDict();

      let navHeader = '';
      if (currentPageNum) {
        navHeader = `
          <div class="w-full theme-card border rounded-2xl p-4 sm:p-6 mb-6 text-center flex items-center justify-between" style="border-color: var(--accent);">
            <button ${currentPageNum > 1 ? `onclick="navigate('page/${currentPageNum - 1}')"` : 'disabled'} class="px-2.5 py-1 theme-inner border rounded-lg text-2xs sm:text-xs font-semibold ${currentPageNum <= 1 ? 'opacity-40 cursor-not-allowed' : 'theme-accent-text'}">⬅ Prev</button>
            <div>
              <h1 class="text-xl sm:text-2xl font-extrabold">Page ${currentPageNum}</h1>
              <p class="theme-accent-text font-medium text-3xs sm:text-2xs mt-0.5">Page ${currentPageNum} of ${MAX_PAGES}</p>
            </div>
            <button ${currentPageNum < MAX_PAGES ? `onclick="navigate('page/${currentPageNum + 1}')"` : 'disabled'} class="px-2.5 py-1 theme-inner border rounded-lg text-2xs sm:text-xs font-semibold ${currentPageNum >= MAX_PAGES ? 'opacity-40 cursor-not-allowed' : 'theme-accent-text'}">Next ➡</button>
          </div>
        `;
      } else if (title) {
        navHeader = `<div class="w-full theme-card border rounded-2xl p-4 sm:p-6 mb-6 text-center" style="border-color: var(--accent);"><h1 class="text-xl sm:text-2xl font-extrabold">${title}</h1></div>`;
      }

      if (!qudratullahData) {
        return `${navHeader}<div class="p-8 text-center text-red-400 text-xs">Failed to load dataset.</div>`;
      }

      if (asVerseList && rangeFilter) {
        return navHeader + await renderVerseByVerseMode(rangeFilter.fromS, rangeFilter.fromA, rangeFilter.toS, rangeFilter.toA, preloadedTranslations);
      }

      let pagesHtml = "";

      for (const p of pageNumbers) {
        const pageObj = qudratullahData[p] || qudratullahData[String(p)];
        if (!pageObj || !pageObj.lines) continue;

        const lines = pageObj.lines;
        const sortedLineKeys = Object.keys(lines).sort((a, b) => parseInt(a) - parseInt(b));

        let linesHtml = "";
        let currentVerseKey = null;

        for (const lineNum of sortedLineKeys) {
          const line = lines[lineNum];
          let contentHtml = "";

          if (line.type === 'surah_name') {
            if (rangeFilter && (line.surah_number < rangeFilter.fromS || line.surah_number > rangeFilter.toS)) continue;
            const sMeta = chaptersData.find(c => c.id === line.surah_number);
            const arabicSurahName = sMeta ? sMeta.name_arabic : `سُورَةُ ${line.surah_number || ''}`;
            contentHtml = `<div class="line-content surah-header">سُورَةُ ${arabicSurahName}</div>`;
          } else if (line.type === 'basmallah') {
            contentHtml = `<div class="line-content" style="color: var(--accent); font-weight: bold;">${BISMILLAH_ARABIC}</div>`;
          } else if (line.data && Array.isArray(line.data)) {
            let filteredWords = [];

            for (const wordObj of line.data) {
              const text = typeof wordObj === 'string' ? wordObj : (wordObj.text || wordObj);
              if (wordObj && wordObj.verse_key) {
                if (currentVerseKey !== wordObj.verse_key) {
                  currentVerseKey = wordObj.verse_key;
                }
              }

              if (rangeFilter && currentVerseKey) {
                const [s, a] = currentVerseKey.split(':').map(Number);
                if (s < rangeFilter.fromS || s > rangeFilter.toS) continue;
                if (s === rangeFilter.fromS && a < rangeFilter.fromA) continue;
                if (s === rangeFilter.toS && a > rangeFilter.toA) continue;
              }

              filteredWords.push(`<span>${text}</span>`);
            }

            if (filteredWords.length === 0) continue;
            contentHtml = `<div class="line-content" ${currentVerseKey ? `data-verse-key="${currentVerseKey}" id="verse-${currentVerseKey}"` : ''}>${filteredWords.join(' ')}</div>`;
          } else if (line.text) {
            contentHtml = `<div class="line-content">${line.text}</div>`;
          }

          if (contentHtml) {
            linesHtml += `<div class="mushaf-line">${contentHtml}</div>`;
          }
        }

        if (!linesHtml.trim()) continue;

        pagesHtml += `
          <div class="mushaf-page-box mb-8">
            <div class="flex items-center justify-between mb-2 px-2">
              <span class="theme-accent-text font-bold text-xs uppercase">Page ${p}</span>
            </div>
            <div class="mushaf-page flex flex-col gap-1.5" dir="rtl">
              ${linesHtml}
            </div>
          </div>
        `;
      }

      return `${navHeader}<div class="w-full space-y-6">${pagesHtml}</div>`;
    }

    function showLoading(msg) {
      document.getElementById("app").innerHTML = `
        <div class="flex flex-col items-center justify-center py-20 space-y-3">
          <div class="w-8 h-8 border-3 border-t-transparent rounded-full animate-spin" style="border-color: var(--accent); border-top-color: transparent;"></div>
          <p class="theme-text-muted text-xs animate-pulse">${msg}</p>
        </div>
      `;
    }

    function render404() {
      document.getElementById("app").innerHTML = `
        <div class="text-center py-20">
          <h1 class="text-xl font-bold text-red-500">View Not Found</h1>
          <a href="#/" onclick="navigate(''); return false;" class="mt-3 inline-block text-[var(--accent)] hover:underline text-xs">Back to Home</a>
        </div>
      `;
    }

    window.addEventListener("load", () => {
      applyTheme(currentTheme);
      applyAccentColor(currentAccent);
      initTotalTimeTracker();
      document.getElementById("displayModeSelect").value = displayMode;
      if (!window.location.hash) window.location.hash = "#/";
      else router();
    });
  </script>
</body>
</html>
