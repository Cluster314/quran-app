<!DOCTYPE html>
<html lang="ar" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Noble Quran - Indo-Pak Hifz Reader</title>
  
  <!-- Standard Browser Favicon -->
  <link rel="icon" type="image/x-icon" href="/quran-app/favicon.ico">

  <!-- Web App Manifest (Android Chrome & PWA support) -->
  <link rel="manifest" href="/site.webmanifest">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            theme: {
              DEFAULT: '#40bfff',
              hover: '#3399cc',
              dark: '#267399',
              light: '#66ccff'
            }
          },
          fontFamily: {
            indopak: ['"Scheherazade New"', '"Amiri"', 'serif'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts for Standard Indo-Pak Hifz Print Script -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #4b5563; }

    /* Clear Indo-Pak 15-Line Hifz Script Styling */
    .indopak-text {
      font-family: 'Scheherazade New', 'Amiri', serif;
      line-height: 2.3;
      letter-spacing: 0px;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col transition-colors duration-200">

  <!-- TOP HEADER & NAVIGATION TOOLBAR -->
  <header class="sticky top-0 z-50 bg-gray-900/95 backdrop-blur border-b border-gray-800 px-4 lg:px-8 py-3 flex flex-col gap-3 w-full">
    
    <div class="flex items-center justify-between w-full">
      <!-- Logo & Title -->
      <a href="#/" onclick="navigate('/'); return false;" class="flex items-center space-x-2 text-[#40bfff] font-bold text-xl tracking-wide hover:opacity-80 transition">
        <span>📖</span>
        <span>Quran Indo-Pak Hifz</span>
      </a>

      <!-- Quick Navigation Mode Tabs -->
      <div class="flex items-center space-x-2 text-xs">
        <button onclick="setNavMode('surah')" id="tabSurah" class="px-3 py-1.5 rounded-lg border border-[#40bfff] bg-[#40bfff]/10 text-[#40bfff] font-semibold transition">Surah</button>
        <button onclick="setNavMode('range')" id="tabRange" class="px-3 py-1.5 rounded-lg border border-gray-700 bg-gray-800 text-gray-300 hover:border-[#40bfff] transition">Custom Range</button>
        <button onclick="setNavMode('juz')" id="tabJuz" class="px-3 py-1.5 rounded-lg border border-gray-700 bg-gray-800 text-gray-300 hover:border-[#40bfff] transition">Juz (Para)</button>
        <button onclick="setNavMode('page')" id="tabPage" class="px-3 py-1.5 rounded-lg border border-gray-700 bg-gray-800 text-gray-300 hover:border-[#40bfff] transition">15-Line Page</button>
      </div>

      <!-- Dark Mode Toggle -->
      <button onclick="toggleTheme()" class="p-2 bg-gray-800 hover:bg-gray-700 rounded-lg text-gray-300 transition" title="Toggle Light/Dark Mode">
        <span id="themeIcon">🌙</span>
      </button>
    </div>

    <!-- DYNAMIC CONTROLS PANEL -->
    <div class="w-full bg-gray-800/80 border border-gray-700/80 rounded-xl p-2.5 flex flex-wrap items-center justify-center gap-3 text-sm">
      
      <!-- MODE 1: SINGLE SURAH SELECTOR -->
      <div id="controlsSurah" class="flex items-center space-x-2">
        <span class="text-xs text-gray-400">Surah:</span>
        <select id="surahSelect" onchange="if(this.value) navigate('/surah/' + this.value)" class="bg-gray-900 text-sm border border-gray-700 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-[#40bfff]">
          <option value="">Select Surah...</option>
        </select>
      </div>

      <!-- MODE 2: CROSS-SURAH AYAH RANGE SELECTOR -->
      <div id="controlsRange" class="hidden flex-wrap items-center justify-center gap-2">
        <!-- Start Point -->
        <div class="flex items-center space-x-1.5">
          <span class="text-xs text-gray-400">From:</span>
          <select id="startSurahSelect" onchange="updateStartAyahMax()" class="bg-gray-900 text-xs border border-gray-700 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-[#40bfff]">
            <option value="">Start Surah</option>
          </select>
          <span class="text-xs text-gray-500">:</span>
          <input type="number" id="startAyahInput" placeholder="Ayah" min="1" value="1" class="w-16 bg-gray-900 text-xs border border-gray-700 rounded-lg px-2 py-1.5 text-center focus:outline-none focus:ring-1 focus:ring-[#40bfff]" />
        </div>

        <span class="text-[#40bfff] font-bold px-1">➔</span>

        <!-- End Point -->
        <div class="flex items-center space-x-1.5">
          <span class="text-xs text-gray-400">To:</span>
          <select id="endSurahSelect" onchange="updateEndAyahMax()" class="bg-gray-900 text-xs border border-gray-700 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-[#40bfff]">
            <option value="">End Surah</option>
          </select>
          <span class="text-xs text-gray-500">:</span>
          <input type="number" id="endAyahInput" placeholder="Ayah" min="1" value="1" class="w-16 bg-gray-900 text-xs border border-gray-700 rounded-lg px-2 py-1.5 text-center focus:outline-none focus:ring-1 focus:ring-[#40bfff]" />
        </div>

        <button onclick="applyCrossSurahRange()" class="bg-[#40bfff] hover:bg-[#3399cc] text-gray-900 text-xs px-3 py-1.5 rounded-lg font-bold transition ml-1">
          Read Range
        </button>
      </div>

      <!-- MODE 3: JUZ SELECTOR -->
      <div id="controlsJuz" class="hidden items-center space-x-2">
        <span class="text-xs text-gray-400">Juz (Para):</span>
        <select id="juzSelect" onchange="if(this.value) navigate('/juz/' + this.value)" class="bg-gray-900 text-sm border border-gray-700 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-[#40bfff]">
          <option value="">Select Juz (1-30)...</option>
        </select>
      </div>

      <!-- MODE 4: PAGE SELECTOR -->
      <div id="controlsPage" class="hidden items-center space-x-2">
        <span class="text-xs text-gray-400">15-Line Page:</span>
        <select id="pageSelect" onchange="if(this.value) navigate('/page/' + this.value)" class="bg-gray-900 text-sm border border-gray-700 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-[#40bfff]">
          <option value="">Select Page (1-604)...</option>
        </select>
      </div>

    </div>
  </header>

  <!-- MAIN VIEW CONTAINER -->
  <main id="app" class="flex-1 w-full px-4 md:px-8 lg:px-16 py-6 max-w-7xl mx-auto">
    <!-- Dynamic Content -->
  </main>

  <script>
    const API_BASE = "https://api.quran.com/api/v4";
    let chaptersData = [];

    // --- EXACT SOUTH ASIAN / INDO-PAK HIFZ JUZ (PARA) BOUNDARIES ---
    const INDOPAK_JUZ_BOUNDARIES = {
      1:  [1, 1, 2, 141],
      2:  [2, 142, 2, 252],
      3:  [2, 253, 3, 91],
      4:  [3, 92, 4, 23],
      5:  [4, 24, 4, 147],
      6:  [4, 148, 5, 81],
      7:  [5, 82, 6, 110],
      8:  [6, 111, 7, 87],
      9:  [7, 88, 8, 40],
      10: [8, 41, 9, 93],
      11: [9, 94, 11, 5],
      12: [11, 6, 12, 52],
      13: [12, 53, 15, 1],
      14: [15, 2, 16, 128],
      15: [17, 1, 18, 74],
      16: [18, 75, 20, 135],
      17: [21, 1, 22, 78],
      18: [23, 1, 25, 20],
      19: [25, 21, 27, 59],
      20: [27, 60, 29, 44],
      21: [29, 45, 33, 30],
      22: [33, 31, 36, 21],
      23: [36, 22, 39, 31],
      24: [39, 32, 41, 46],
      25: [41, 47, 45, 37],
      26: [46, 1, 51, 30],
      27: [51, 31, 57, 29],
      28: [58, 1, 66, 12],
      29: [67, 1, 77, 50],
      30: [78, 1, 114, 6]
    };

    // --- ROUTER ENGINE ---
    function navigate(path) {
      window.location.hash = path;
    }

    window.addEventListener("hashchange", router);

    async function router() {
      const hash = window.location.hash.replace('#', '') || '/';

      if (chaptersData.length === 0) {
        await loadChapters();
      }

      resetNavControls();

      if (hash === "/" || hash === "") {
        setNavMode('surah');
        renderHome();
      } else if (hash.startsWith("/surah/")) {
        setNavMode('surah');
        const id = parseInt(hash.split("/")[2]);
        if (id >= 1 && id <= 114) {
          document.getElementById("surahSelect").value = id;
          renderSurah(id);
        } else {
          render404();
        }
      } else if (hash.startsWith("/range")) {
        setNavMode('range');
        const params = new URLSearchParams(hash.split("?")[1] || "");
        const fromS = parseInt(params.get("fromSurah")) || 1;
        const fromA = parseInt(params.get("fromAyah")) || 1;
        const toS = parseInt(params.get("toSurah")) || fromS;
        const toA = parseInt(params.get("toAyah")) || 1;

        document.getElementById("startSurahSelect").value = fromS;
        document.getElementById("startAyahInput").value = fromA;
        document.getElementById("endSurahSelect").value = toS;
        document.getElementById("endAyahInput").value = toA;

        renderCrossSurahRange(fromS, fromA, toS, toA);
      } else if (hash.startsWith("/juz/")) {
        setNavMode('juz');
        const juzId = parseInt(hash.split("/")[2]);
        if (juzId >= 1 && juzId <= 30) {
          document.getElementById("juzSelect").value = juzId;
          renderJuz(juzId);
        } else {
          render404();
        }
      } else if (hash.startsWith("/page/")) {
        setNavMode('page');
        const pageId = parseInt(hash.split("/")[2]);
        if (pageId >= 1 && pageId <= 604) {
          document.getElementById("pageSelect").value = pageId;
          renderPage(pageId);
        } else {
          render404();
        }
      } else {
        renderHome();
      }
    }

    // --- NAVIGATION TABS MANAGEMENT ---
    function setNavMode(mode) {
      const modes = ['surah', 'range', 'juz', 'page'];
      modes.forEach(m => {
        const tab = document.getElementById(`tab${m.charAt(0).toUpperCase() + m.slice(1)}`);
        const ctrl = document.getElementById(`controls${m.charAt(0).toUpperCase() + m.slice(1)}`);
        
        if (m === mode) {
          tab.className = "px-3 py-1.5 rounded-lg border border-[#40bfff] bg-[#40bfff]/10 text-[#40bfff] font-semibold transition";
          ctrl.classList.remove("hidden");
          ctrl.classList.add("flex");
        } else {
          tab.className = "px-3 py-1.5 rounded-lg border border-gray-700 bg-gray-800 text-gray-300 hover:border-[#40bfff] transition";
          ctrl.classList.add("hidden");
          ctrl.classList.remove("flex");
        }
      });
    }

    function resetNavControls() {
      document.getElementById("surahSelect").value = "";
      document.getElementById("juzSelect").value = "";
      document.getElementById("pageSelect").value = "";
    }

    // --- INITIAL DATA FETCH ---
    async function loadChapters() {
      try {
        const res = await fetch(`${API_BASE}/chapters?language=en`);
        const data = await res.json();
        chaptersData = data.chapters;
        populateDropdowns();
      } catch (err) {
        console.error("Failed to fetch chapters:", err);
      }
    }

    function populateDropdowns() {
      const options = `<option value="">Select Surah...</option>` + 
        chaptersData.map(c => `<option value="${c.id}">${c.id}. ${c.name_simple} (${c.name_arabic})</option>`).join("");

      document.getElementById("surahSelect").innerHTML = options;
      document.getElementById("startSurahSelect").innerHTML = options;
      document.getElementById("endSurahSelect").innerHTML = options;

      // Juz Options
      let juzOpts = `<option value="">Select Juz...</option>`;
      for (let i = 1; i <= 30; i++) juzOpts += `<option value="${i}">Juz (Para) ${i}</option>`;
      document.getElementById("juzSelect").innerHTML = juzOpts;

      // Page Options (15-line Hifz Mushaf = 604 pages)
      let pageOpts = `<option value="">Select Page...</option>`;
      for (let i = 1; i <= 604; i++) pageOpts += `<option value="${i}">Page ${i}</option>`;
      document.getElementById("pageSelect").innerHTML = pageOpts;
    }

    function updateStartAyahMax() {
      const sId = parseInt(document.getElementById("startSurahSelect").value);
      if (!sId) return;
      const meta = chaptersData.find(c => c.id === sId);
      document.getElementById("startAyahInput").max = meta.verses_count;
    }

    function updateEndAyahMax() {
      const sId = parseInt(document.getElementById("endSurahSelect").value);
      if (!sId) return;
      const meta = chaptersData.find(c => c.id === sId);
      document.getElementById("endAyahInput").max = meta.verses_count;
    }

    function applyCrossSurahRange() {
      const fromS = parseInt(document.getElementById("startSurahSelect").value);
      const fromA = parseInt(document.getElementById("startAyahInput").value) || 1;
      const toS = parseInt(document.getElementById("endSurahSelect").value) || fromS;
      const toA = parseInt(document.getElementById("endAyahInput").value) || 1;

      if (!fromS) {
        alert("Please select a starting Surah.");
        return;
      }

      navigate(`/range?fromSurah=${fromS}&fromAyah=${fromA}&toSurah=${toS}&toAyah=${toA}`);
    }

    // --- FETCH HELPER WITH INDO-PAK SCRIPT ---
    async function fetchChapterVerses(surahId) {
      let allVerses = [];
      let page = 1;
      let totalPages = 1;

      while (page <= totalPages) {
        const res = await fetch(
          `${API_BASE}/verses/by_chapter/${surahId}?fields=text_indopak,text_uthmani&per_page=50&page=${page}`
        );
        if (!res.ok) throw new Error(`API Error: ${res.status}`);
        const data = await res.json();
        allVerses = allVerses.concat(data.verses);
        totalPages = data.pagination.total_pages;
        page++;
      }
      return allVerses;
    }

    // --- VIEWS ---

    // 1. HOME VIEW
    function renderHome() {
      const app = document.getElementById("app");
      document.title = "The Noble Quran - Indo-Pak Hifz Reader";

      app.innerHTML = `
        <div class="mb-8 text-center max-w-2xl mx-auto py-4 space-y-2">
          <h1 class="text-3xl font-extrabold text-white">The Noble Quran</h1>
          <p class="text-[#40bfff] font-medium text-xs">Indo-Pakistani Script (South Asian 15-Line Hifz Standard)</p>
          <p class="text-gray-400 text-xs">Read by Surah, Exact Indo-Pak Juz, 15-Line Page, or set a custom range across multiple Surahs.</p>
        </div>

        <div id="surahGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-3 w-full">
          ${chaptersData.map(c => `
            <a href="#/surah/${c.id}" onclick="navigate('/surah/${c.id}'); return false;" 
               class="bg-gray-800/60 hover:bg-gray-800 border border-gray-700/60 hover:border-[#40bfff]/50 p-3.5 rounded-xl transition duration-200 flex items-center justify-between group">
              <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-lg bg-gray-900/80 border border-gray-700 flex items-center justify-center text-xs font-bold text-[#40bfff] group-hover:bg-[#40bfff] group-hover:text-gray-900 transition">
                  ${c.id}
                </div>
                <div>
                  <div class="font-semibold text-sm text-gray-100 group-hover:text-[#40bfff] transition">${c.name_simple}</div>
                  <div class="text-[11px] text-gray-400">${c.verses_count} Verses</div>
                </div>
              </div>
              <div class="font-indopak text-lg text-gray-300">${c.name_arabic}</div>
            </a>
          `).join("")}
        </div>
      `;
    }

    // 2. SINGLE SURAH VIEW
    async function renderSurah(surahId) {
      const app = document.getElementById("app");
      const surahMeta = chaptersData.find(c => c.id === surahId);
      
      document.title = `${surahMeta.name_simple} - Indo-Pak Quran`;
      showLoading(`Loading Surah ${surahMeta.name_simple}...`);

      try {
        const verses = await fetchChapterVerses(surahId);

        let html = `
          <!-- SURAH HEADER BANNER -->
          <div class="w-full bg-gray-800/80 border border-gray-700/80 rounded-2xl p-6 mb-8 text-center relative overflow-hidden">
            <div class="space-y-2 relative z-10">
              <h1 class="text-3xl md:text-4xl font-extrabold text-white">${surahMeta.name_simple}</h1>
              <p class="text-[#40bfff] font-medium text-sm">${surahMeta.translated_name.name} • ${surahMeta.verses_count} Verses</p>
              <div class="text-3xl font-indopak text-gray-200 pt-1">${surahMeta.name_arabic}</div>
            </div>

            ${surahId !== 1 && surahId !== 9 ? `
              <div class="mt-6 font-indopak text-2xl md:text-3xl text-[#40bfff] border-t border-gray-700/60 pt-4 w-full max-w-md mx-auto" dir="rtl">
                بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ
              </div>
            ` : ''}
          </div>

          ${renderVersesList(verses)}
        `;

        app.innerHTML = html;
        window.scrollTo({ top: 0, behavior: "smooth" });

      } catch (err) {
        console.error(err);
        app.innerHTML = `<div class="text-center py-20 text-red-400">Failed to load verses. Please try refreshing.</div>`;
      }
    }

    // 3. CROSS-SURAH RANGE VIEW (Used directly & internally for Juz rendering)
    async function renderCrossSurahRange(fromSurah, fromAyah, toSurah, toAyah, customHeaderTitle = null) {
      const app = document.getElementById("app");
      
      // Validation & Re-ordering
      if (fromSurah > toSurah || (fromSurah === toSurah && fromAyah > toAyah)) {
        app.innerHTML = `<div class="text-center py-20 text-amber-400 font-semibold">Invalid range. Start point must be before end point.</div>`;
        return;
      }

      const startMeta = chaptersData.find(c => c.id === fromSurah);
      const endMeta = chaptersData.find(c => c.id === toSurah);

      document.title = customHeaderTitle || `${startMeta.name_simple} (${fromAyah}) - ${endMeta.name_simple} (${toAyah}) - Range Read`;
      showLoading(`Fetching verses from ${startMeta.name_simple}:${fromAyah} to ${endMeta.name_simple}:${toAyah}...`);

      try {
        let compiledSections = [];

        for (let sId = fromSurah; sId <= toSurah; sId++) {
          const meta = chaptersData.find(c => c.id === sId);
          let verses = await fetchChapterVerses(sId);

          let startFilter = 1;
          let endFilter = meta.verses_count;

          if (sId === fromSurah) startFilter = fromAyah;
          if (sId === toSurah) endFilter = toAyah;

          const filtered = verses.filter(v => {
            const num = parseInt(v.verse_key.split(":")[1]);
            return num >= startFilter && num <= endFilter;
          });

          compiledSections.push({
            surahMeta: meta,
            verses: filtered,
            isStartSection: sId === fromSurah,
            showBismillah: sId !== 1 && sId !== 9 && (sId !== fromSurah || fromAyah === 1)
          });
        }

        let html = `
          <!-- RANGE HEADER BANNER -->
          <div class="w-full bg-gradient-to-r from-gray-800 via-gray-800/90 to-gray-800 border border-[#40bfff]/30 rounded-2xl p-6 mb-8 text-center">
            <h1 class="text-2xl md:text-3xl font-extrabold text-white">${customHeaderTitle || 'Custom Ayah Range'}</h1>
            <p class="text-[#40bfff] font-medium text-sm mt-1">
              ${startMeta.name_simple} [${fromAyah}] ➔ ${endMeta.name_simple} [${toAyah}]
            </p>
          </div>
        `;

        compiledSections.forEach(section => {
          html += `
            <div class="mb-10">
              <!-- SURAH SECTION HEADER -->
              <div class="bg-gray-800/60 border border-gray-700/60 rounded-xl p-4 mb-6 flex items-center justify-between">
                <div>
                  <h2 class="text-lg font-bold text-white">${section.surahMeta.id}. Surah ${section.surahMeta.name_simple}</h2>
                  <span class="text-xs text-gray-400">${section.surahMeta.translated_name.name}</span>
                </div>
                <div class="font-indopak text-2xl text-[#40bfff]">${section.surahMeta.name_arabic}</div>
              </div>

              ${section.showBismillah ? `
                <div class="text-center font-indopak text-2xl text-[#40bfff] py-3 mb-6 bg-gray-900/50 rounded-xl border border-gray-800" dir="rtl">
                  بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ
                </div>
              ` : ''}

              ${renderVersesList(section.verses)}
            </div>
          `;
        });

        app.innerHTML = html;
        window.scrollTo({ top: 0, behavior: "smooth" });

      } catch (err) {
        console.error(err);
        app.innerHTML = `<div class="text-center py-20 text-red-400">Failed to load range. Please try again.</div>`;
      }
    }

    // 4. JUZ (PARA) VIEW (Using Exact Indo-Pak Hifz Map)
    async function renderJuz(juzNumber) {
      const bounds = INDOPAK_JUZ_BOUNDARIES[juzNumber];
      if (!bounds) {
        render404();
        return;
      }

      const [fromS, fromA, toS, toA] = bounds;
      renderCrossSurahRange(fromS, fromA, toS, toA, `Juz (Para) ${juzNumber}`);
    }

    // 5. 15-LINE HIFZ PAGE VIEW
    async function renderPage(pageNumber) {
      const app = document.getElementById("app");
      document.title = `Page ${pageNumber} - Indo-Pak Hifz`;
      showLoading(`Loading Page ${pageNumber}...`);

      try {
        const res = await fetch(`${API_BASE}/verses/by_page/${pageNumber}?fields=text_indopak,text_uthmani&per_page=50`);
        if (!res.ok) throw new Error(`API error: ${res.status}`);
        
        const data = await res.json();
        const verses = data.verses;

        const prevPage = pageNumber > 1 ? pageNumber - 1 : null;
        const nextPage = pageNumber < 604 ? pageNumber + 1 : null;

        let html = `
          <div class="w-full bg-gray-800/80 border border-gray-700/80 rounded-2xl p-4 md:p-6 mb-8 flex items-center justify-between">
            ${prevPage ? `
              <a href="#/page/${prevPage}" onclick="navigate('/page/${prevPage}'); return false;" class="px-3 py-1.5 bg-gray-900 border border-gray-700 hover:border-[#40bfff] text-xs md:text-sm font-semibold rounded-lg text-[#40bfff] transition">
                ← Page ${prevPage}
              </a>
            ` : '<div></div>'}

            <div class="text-center">
              <h1 class="text-2xl md:text-3xl font-extrabold text-white">Page ${pageNumber}</h1>
              <p class="text-xs text-gray-400 mt-0.5">15-Line Hifz Mushaf Print Standard</p>
            </div>

            ${nextPage ? `
              <a href="#/page/${nextPage}" onclick="navigate('/page/${nextPage}'); return false;" class="px-3 py-1.5 bg-gray-900 border border-gray-700 hover:border-[#40bfff] text-xs md:text-sm font-semibold rounded-lg text-[#40bfff] transition">
                Page ${nextPage} →
              </a>
            ` : '<div></div>'}
          </div>

          ${renderVersesList(verses)}
        `;

        app.innerHTML = html;
        window.scrollTo({ top: 0, behavior: "smooth" });

      } catch (err) {
        console.error(err);
        app.innerHTML = `<div class="text-center py-20 text-red-400">Failed to load Page ${pageNumber}.</div>`;
      }
    }

    // --- REUSABLE INDO-PAK VERSE LIST COMPONENT ---
    function renderVersesList(verses) {
      return `
        <div class="w-full space-y-4">
          ${verses.map(v => {
            const arabicText = v.text_indopak || v.text_uthmani;
            return `
              <div id="verse-${v.verse_key}" class="w-full bg-gray-800/40 hover:bg-gray-800/70 border border-gray-800/80 hover:border-gray-700 rounded-xl p-5 md:p-8 transition duration-150 flex flex-col space-y-4">
                
                <div class="flex items-center justify-between border-b border-gray-700/40 pb-3">
                  <span class="px-3 py-1 bg-[#40bfff]/10 border border-[#40bfff]/20 text-[#40bfff] text-xs font-semibold rounded-full">
                    ${v.verse_key}
                  </span>

                  <button onclick="navigator.clipboard.writeText('${arabicText.replace(/'/g, "\\'")}')" class="text-xs text-gray-400 hover:text-[#40bfff] transition">
                    📋 Copy Verse
                  </button>
                </div>

                <!-- Clear Indo-Pak Script -->
                <div class="text-right indopak-text text-3xl md:text-4xl text-gray-100 px-2 pt-2" dir="rtl">
                  ${arabicText}
                </div>

              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    // --- UTILITIES ---
    function showLoading(msg) {
      document.getElementById("app").innerHTML = `
        <div class="flex flex-col items-center justify-center py-20 space-y-4">
          <div class="w-10 h-10 border-4 border-[#40bfff] border-t-transparent rounded-full animate-spin"></div>
          <p class="text-gray-400 text-sm animate-pulse">${msg}</p>
        </div>
      `;
    }

    function render404() {
      document.getElementById("app").innerHTML = `
        <div class="text-center py-20">
          <h1 class="text-2xl font-bold text-red-400">View Not Found</h1>
          <a href="#/" onclick="navigate('/'); return false;" class="mt-4 inline-block text-[#40bfff] hover:underline">Back to Home</a>
        </div>
      `;
    }

    function toggleTheme() {
      const html = document.documentElement;
      const icon = document.getElementById("themeIcon");
      if (html.classList.contains("dark")) {
        html.classList.remove("dark");
        html.classList.add("light");
        document.body.classList.replace("bg-gray-900", "bg-gray-50");
        document.body.classList.replace("text-gray-100", "text-gray-900");
        icon.innerText = "☀️";
      } else {
        html.classList.remove("light");
        html.classList.add("dark");
        document.body.classList.replace("bg-gray-50", "bg-gray-900");
        document.body.classList.replace("text-gray-900", "text-gray-100");
        icon.innerText = "🌙";
      }
    }

    // DOM Ready Initialization
    window.addEventListener("DOMContentLoaded", () => {
      if (!window.location.hash) {
        window.location.hash = "#/";
      } else {
        router();
      }
    });
  </script>
</body>
</html>
