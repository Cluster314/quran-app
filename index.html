<!DOCTYPE html>
<html lang="ar" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Noble Quran - Indo-Pak Reader</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { theme: { DEFAULT: '#0284c7', hover: '#0369a1' } },
          fontFamily: {
            indopak: ['"Scheherazade New"', '"Amiri"', '"Noto Naskh Arabic"', 'serif'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Scheherazade+New:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #6b7280; border-radius: 4px; }

    .reading-wrapper {
      direction: rtl;
      text-align: justify;
      text-align-last: justify;
      word-spacing: 0.15em;
    }

    .indopak-text {
      font-family: 'Scheherazade New', 'Amiri', 'Noto Naskh Arabic', serif;
      text-rendering: optimizeLegibility;
      direction: rtl;
      unicode-bidi: isolate;
      line-height: 2.8 !important;
    }

    .ayah-container {
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 2.2rem;
      height: 2.2rem;
      margin: 0 0.3rem;
      vertical-align: middle;
      direction: ltr;
      unicode-bidi: isolate;
      white-space: nowrap;
    }

    .ayah-number {
      position: absolute;
      font-family: 'Noto Naskh Arabic', 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      color: #0284c7;
      line-height: 1;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col transition-colors duration-200">

  <header class="sticky top-0 z-50 bg-gray-900/95 backdrop-blur border-b border-gray-800 px-4 lg:px-8 py-3 flex flex-col gap-3 w-full">
    <div class="flex items-center justify-between w-full">
      <a href="#/" onclick="navigate('/'); return false;" class="flex items-center space-x-2 text-sky-400 font-bold text-xl tracking-wide">
        <span>📖</span>
        <span>Quran Indo-Pak</span>
      </a>

      <div class="flex items-center space-x-2 text-xs">
        <button onclick="setNavMode('surah')" id="tabSurah" class="px-3 py-1.5 rounded-lg border border-sky-500 bg-sky-500/10 text-sky-400 font-semibold transition">Surah</button>
        <button onclick="setNavMode('page')" id="tabPage" class="px-3 py-1.5 rounded-lg border border-gray-700 bg-gray-800 text-gray-300 hover:border-sky-500 transition">Page</button>
        <button onclick="setNavMode('range')" id="tabRange" class="px-3 py-1.5 rounded-lg border border-gray-700 bg-gray-800 text-gray-300 hover:border-sky-500 transition">Custom Range</button>
        <button onclick="setNavMode('juz')" id="tabJuz" class="px-3 py-1.5 rounded-lg border border-gray-700 bg-gray-800 text-gray-300 hover:border-sky-500 transition">Juz (Para)</button>
      </div>

      <div class="flex items-center space-x-2">
        <select id="displayModeSelect" onchange="changeDisplayMode(this.value)" class="bg-gray-800 text-gray-300 text-xs font-semibold border border-gray-700 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-sky-500">
          <option value="verse">🔢 Verse-by-Verse</option>
          <option value="reading-arabic">📜 Reading (Arabic)</option>
          <option value="reading-translation">🌐 Reading (Translation)</option>
        </select>
      </div>
    </div>

    <div class="w-full bg-gray-800/80 border border-gray-700/80 rounded-xl p-2.5 flex flex-wrap items-center justify-center gap-3 text-sm">
      <div id="controlsSurah" class="flex items-center space-x-2">
        <span class="text-xs text-gray-400">Surah:</span>
        <select id="surahSelect" onchange="if(this.value) navigate('/' + this.value)" class="bg-gray-900 text-gray-100 text-sm border border-gray-700 rounded-lg px-3 py-1.5">
          <option value="">Select Surah...</option>
        </select>
      </div>

      <div id="controlsPage" class="hidden items-center space-x-2">
        <span class="text-xs text-gray-400">Page:</span>
        <select id="pageSelect" onchange="if(this.value) navigate('/page/' + this.value)" class="bg-gray-900 text-gray-100 text-sm border border-gray-700 rounded-lg px-3 py-1.5">
          <option value="">Select Page (1-604)...</option>
        </select>
      </div>

      <div id="controlsRange" class="hidden flex-wrap items-center justify-center gap-2">
        <div class="flex items-center space-x-1.5">
          <span class="text-xs text-gray-400">From:</span>
          <select id="startSurahSelect" onchange="updateStartAyahMax()" class="bg-gray-900 text-gray-100 text-xs border border-gray-700 rounded-lg px-2.5 py-1.5">
            <option value="">Start Surah</option>
          </select>
          <span class="text-xs text-gray-400">:</span>
          <input type="number" id="startAyahInput" placeholder="Ayah" min="1" value="1" class="w-16 bg-gray-900 text-gray-100 text-xs border border-gray-700 rounded-lg px-2 py-1.5 text-center" />
        </div>

        <span class="text-sky-500 font-bold px-1">➔</span>

        <div class="flex items-center space-x-1.5">
          <span class="text-xs text-gray-400">To:</span>
          <select id="endSurahSelect" onchange="updateEndAyahMax()" class="bg-gray-900 text-gray-100 text-xs border border-gray-700 rounded-lg px-2.5 py-1.5">
            <option value="">End Surah</option>
          </select>
          <span class="text-xs text-gray-400">:</span>
          <input type="number" id="endAyahInput" placeholder="Ayah" min="1" value="1" class="w-16 bg-gray-900 text-gray-100 text-xs border border-gray-700 rounded-lg px-2 py-1.5 text-center" />
        </div>

        <button onclick="applyCrossSurahRange()" class="bg-sky-500 hover:bg-sky-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold transition ml-1">
          Read Range
        </button>
      </div>

      <div id="controlsJuz" class="hidden items-center space-x-2">
        <span class="text-xs text-gray-400">Juz (Para):</span>
        <select id="juzSelect" onchange="if(this.value) navigate('/juz/' + this.value)" class="bg-gray-900 text-gray-100 text-sm border border-gray-700 rounded-lg px-3 py-1.5">
          <option value="">Select Juz (1-30)...</option>
        </select>
      </div>
    </div>
  </header>

    function toArabicNumeral(num) {
      const arabicDigits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
      return num.toString().split('').map(d => arabicDigits[d]).join('');
    }

    function sanitizeArabicText(str) {
      if (!str) return "";
      return str.replace(/[\u25A0-\u25FF\u2B00-\u2BFF\u200B-\u200D\uFEFF]/g, '').replace(/\u00A0/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function getAyahMarkerSvg(ayahNum) {
      return `&nbsp;<span class="ayah-container" contenteditable="false">
          <svg viewBox="0 0 36 36" class="w-full h-full text-sky-500 fill-current opacity-80" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 2C9.16 2 2 9.16 2 18s7.16 16 16 16 16-7.16 16-16S26.84 2 18 2zm0 30C10.27 32 4 25.73 4 18S10.27 4 18 4s14 6.27 14 14-6.27 14-14 14z"/>
          </svg>
          <span class="ayah-number">${toArabicNumeral(ayahNum)}</span>
        </span>&nbsp;`;
    }

    function changeDisplayMode(newMode) {
      displayMode = newMode;
      const rawHash = window.location.hash.replace('#', '') || '/';
      const [pathPart, queryPart] = rawHash.split('?');
      const params = new URLSearchParams(queryPart || '');
      params.set('mode', newMode);
      window.location.hash = `#${pathPart}?${params.toString()}`;
    }

    function navigate(path) {
      const [pathPart, queryPart] = path.split('?');
      const params = new URLSearchParams(queryPart || '');
      if (displayMode && displayMode !== 'verse') params.set('mode', displayMode);
      const queryString = params.toString();
      window.location.hash = queryString ? `${pathPart}?${queryString}` : pathPart;
    }

    window.addEventListener("hashchange", router);

    async function router() {
      const rawHash = window.location.hash.replace('#', '') || '/';
      const [hash, queryPart] = rawHash.split('?');
      const urlParams = new URLSearchParams(queryPart || '');
      
      if (urlParams.has('mode')) displayMode = urlParams.get('mode');
      document.getElementById("displayModeSelect").value = displayMode;

      if (chaptersData.length === 0) await loadChapters();

      resetNavControls();

      if (hash === "/" || hash === "") {
        setNavMode('surah');
        renderHome();
      } else if (hash.startsWith("/page/")) {
        setNavMode('page');
        const pageNum = parseInt(hash.split("/")[2]);
        if (pageNum >= 1 && pageNum <= 604) {
          document.getElementById("pageSelect").value = pageNum;
          renderPage(pageNum);
        } else {
          render404();
        }
      } else if (hash.startsWith("/range")) {
        setNavMode('range');
        const fromS = parseInt(urlParams.get("fromSurah")) || 1;
        const fromA = parseInt(urlParams.get("fromAyah")) || 1;
        const toS = parseInt(urlParams.get("toSurah")) || fromS;
        const toA = parseInt(urlParams.get("toAyah")) || 1;

        document.getElementById("startSurahSelect").value = fromS;
        document.getElementById("startAyahInput").value = fromA;
        document.getElementById("endSurahSelect").value = toS;
        document.getElementById("endAyahInput").value = toA;

        renderCrossSurahRange(fromS, fromA, toS, toA);
      } else if (hash.startsWith("/juz/")) {
        setNavMode('juz');
        const juzId = parseInt(hash.split("/")[2]);
        if (juzId >= 1 && juzId <= 30) {
          document.getElementById("juzSelect").value = juzId;
          renderJuz(juzId);
        } else {
          render404();
        }
      } else {
        const parts = hash.split("/");
        const id = parseInt(parts[1] || parts[0]);
        if (!isNaN(id) && id >= 1 && id <= 114) {
          setNavMode('surah');
          document.getElementById("surahSelect").value = id;
          renderSurah(id);
        } else {
          renderHome();
        }
      }
    }

    function setNavMode(mode) {
      ['surah', 'page', 'range', 'juz'].forEach(m => {
        const tab = document.getElementById(`tab${m.charAt(0).toUpperCase() + m.slice(1)}`);
        const ctrl = document.getElementById(`controls${m.charAt(0).toUpperCase() + m.slice(1)}`);
        if (m === mode) {
          tab.className = "px-3 py-1.5 rounded-lg border border-sky-500 bg-sky-500/10 text-sky-400 font-semibold transition";
          ctrl.classList.remove("hidden");
          ctrl.classList.add("flex");
        } else {
          tab.className = "px-3 py-1.5 rounded-lg border border-gray-700 bg-gray-800 text-gray-300 hover:border-sky-500 transition";
          ctrl.classList.add("hidden");
          ctrl.classList.remove("flex");
        }
      });
    }

    function resetNavControls() {
      document.getElementById("surahSelect").value = "";
      document.getElementById("pageSelect").value = "";
      document.getElementById("juzSelect").value = "";
    }

    async function loadChapters() {
      try {
        const res = await fetch(`${API_BASE}/surah`);
        const data = await res.json();
        if (data.code !== 200) throw new Error("API Error fetching chapters");
        
        chaptersData = data.data.map(c => ({
          id: c.number,
          name_simple: c.englishName,
          name_arabic: c.name,
          verses_count: c.numberOfAyahs,
          translated_name: { name: c.englishNameTranslation }
        }));
        populateDropdowns();
      } catch (err) {
        console.error("Failed to fetch chapters:", err);
      }
    }

    function populateDropdowns() {
      const options = `<option value="">Select Surah...</option>` + 
        chaptersData.map(c => `<option value="${c.id}">${c.id}. ${c.name_simple} (${c.name_arabic})</option>`).join("");

      document.getElementById("surahSelect").innerHTML = options;
      document.getElementById("startSurahSelect").innerHTML = options;
      document.getElementById("endSurahSelect").innerHTML = options;

      let pageOpts = `<option value="">Select Page...</option>`;
      for (let i = 1; i <= 604; i++) pageOpts += `<option value="${i}">Page ${i}</option>`;
      document.getElementById("pageSelect").innerHTML = pageOpts;

      let juzOpts = `<option value="">Select Juz...</option>`;
      for (let i = 1; i <= 30; i++) juzOpts += `<option value="${i}">Juz (Para) ${i}</option>`;
      document.getElementById("juzSelect").innerHTML = juzOpts;
    }

    function updateStartAyahMax() {
      const sId = parseInt(document.getElementById("startSurahSelect").value);
      if (!sId) return;
      const meta = chaptersData.find(c => c.id === sId);
      document.getElementById("startAyahInput").max = meta.verses_count;
    }

    function updateEndAyahMax() {
      const sId = parseInt(document.getElementById("endSurahSelect").value);
      if (!sId) return;
      const meta = chaptersData.find(c => c.id === sId);
      document.getElementById("endAyahInput").max = meta.verses_count;
    }

    function applyCrossSurahRange() {
      const fromS = parseInt(document.getElementById("startSurahSelect").value);
      const fromA = parseInt(document.getElementById("startAyahInput").value) || 1;
      const toS = parseInt(document.getElementById("endSurahSelect").value) || fromS;
      const toA = parseInt(document.getElementById("endAyahInput").value) || 1;

      if (!fromS) {
        alert("Please select a starting Surah.");
        return;
      }

      navigate(`/range?fromSurah=${fromS}&fromAyah=${fromA}&toSurah=${toS}&toAyah=${toA}`);
    }

    async function fetchSurahTranslation(surahId) {
      if (translationCache[surahId]) return translationCache[surahId];

      try {
        const res = await fetch(`${TRANSLATION_BASE}/${surahId}.json`);
        if (!res.ok) throw new Error(`Failed to load translation`);
        const data = await res.json();
        
        const map = {};
        if (Array.isArray(data)) {
          data.forEach(item => {
            if (Array.isArray(item) && item.length >= 2 && typeof item[0] === 'number') {
              map[item[0]] = Array.isArray(item[1]) ? item[1].join(' ') : String(item[1]);
            } else if (typeof item === 'object' && item !== null) {
              const num = item.ayah || item.verse || item.id;
              const text = item.text || item.translation;
              if (num && text) map[num] = String(text);
            }
          });
        } else if (typeof data === 'object' && data !== null) {
          Object.keys(data).forEach(key => {
            map[key] = String(data[key]);
          });
        }

        translationCache[surahId] = map;
        return map;
      } catch (err) {
        console.error(`Error loading translation:`, err);
        return {};
      }
    }

    async function fetchChapterVerses(surahId) {
      const res = await fetch(`${API_BASE}/surah/${surahId}/${API_EDITION}`);
      const data = await res.json();
      if (data.code !== 200) throw new Error(`API Error: ${data.status}`);
      
      return data.data.ayahs.map(a => ({
        verse_key: `${surahId}:${a.numberInSurah}`,
        text_indopak: a.text
      }));
    }

    async function fetchPageVerses(pageNum) {
      const start = INDOPAK_15_LINE_PAGE_STARTS[pageNum] || [1, 1];
      const nextStart = INDOPAK_15_LINE_PAGE_STARTS[pageNum + 1];

      let fromS = start[0], fromA = start[1];
      let toS, toA;

      if (nextStart) {
        if (nextStart[1] > 1) {
          toS = nextStart[0];
          toA = nextStart[1] - 1;
        } else {
          toS = nextStart[0] - 1;
          const prevSurahMeta = chaptersData.find(c => c.id === toS);
          toA = prevSurahMeta ? prevSurahMeta.verses_count : 1;
        }
      } else {
        toS = 114;
        toA = 6;
      }

      let pageVerses = [];
      for (let sId = fromS; sId <= toS; sId++) {
        const res = await fetch(`${API_BASE}/surah/${sId}/${API_EDITION}`);
        const data = await res.json();
        if (data.code !== 200) continue;

        let startFilter = (sId === fromS) ? fromA : 1;
        let endFilter = (sId === toS) ? toA : data.data.ayahs.length;

        const filtered = data.data.ayahs
          .filter(a => a.numberInSurah >= startFilter && a.numberInSurah <= endFilter)
          .map(a => ({
            verse_key: `${sId}:${a.numberInSurah}`,
            surah_id: sId,
            ayah_num: a.numberInSurah,
            text_indopak: a.text
          }));

        pageVerses.push(...filtered);
      }

      return pageVerses;
    }

    function renderHome() {
      const app = document.getElementById("app");
      document.title = "The Noble Quran - Indo-Pak Reader";

      app.innerHTML = `
        <div class="mb-8 text-center max-w-2xl mx-auto py-4 space-y-2">
          <h1 class="text-3xl font-extrabold text-white">The Noble Quran</h1>
          <p class="text-sky-400 font-medium text-xs">15-Line Indo-Pakistani Layout</p>
        </div>

        <div id="surahGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-3 w-full">
          ${chaptersData.map(c => `
            <a href="#/${c.id}" onclick="navigate('/${c.id}'); return false;" 
               class="bg-gray-800/60 hover:bg-gray-800 border border-gray-700/60 hover:border-sky-500/50 p-3.5 rounded-xl transition duration-200 flex items-center justify-between group">
              <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-lg bg-gray-900/80 border border-gray-700 flex items-center justify-center text-xs font-bold text-sky-400 group-hover:bg-sky-500 group-hover:text-white transition">
                  ${c.id}
                </div>
                <div>
                  <div class="font-semibold text-sm text-gray-100 group-hover:text-sky-400 transition">${c.name_simple}</div>
                  <div class="text-[11px] text-gray-400">${c.verses_count} Verses</div>
                </div>
              </div>
              <div class="font-indopak text-lg text-gray-300" dir="rtl">${c.name_arabic}</div>
            </a>
          `).join("")}
        </div>
      `;
    }

    async function renderSurah(surahId) {
      const app = document.getElementById("app");
      const surahMeta = chaptersData.find(c => c.id === surahId);
      
      document.title = `${surahMeta.name_simple} - Indo-Pak Quran`;
      showLoading(`Loading Surah ${surahMeta.name_simple}...`);

      try {
        const [verses, translations] = await Promise.all([
          fetchChapterVerses(surahId),
          fetchSurahTranslation(surahId)
        ]);

        let html = `
          <div class="w-full bg-gray-800/80 border border-gray-700/80 rounded-2xl p-6 mb-8 text-center relative overflow-hidden">
            <div class="space-y-2 relative z-10">
              <h1 class="text-3xl md:text-4xl font-extrabold text-white">${surahMeta.name_simple}</h1>
              <p class="text-sky-400 font-medium text-sm">${surahMeta.translated_name.name} • ${surahMeta.verses_count} Verses</p>
              <div class="text-3xl font-indopak text-gray-200 pt-1" dir="rtl">${surahMeta.name_arabic}</div>
            </div>

            ${surahId !== 1 && surahId !== 9 ? `
              <div class="mt-6 font-indopak text-2xl md:text-3xl text-sky-400 border-t border-gray-700/60 pt-4 w-full max-w-md mx-auto" dir="rtl">
                بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ
              </div>
            ` : ''}
          </div>

          ${renderContent(verses, translations)}
        `;

        app.innerHTML = html;
        window.scrollTo({ top: 0, behavior: "smooth" });

      } catch (err) {
        console.error(err);
        app.innerHTML = `<div class="text-center py-20 text-red-500">Failed to load verses. Please try refreshing.</div>`;
      }
    }

    async function renderPage(pageNum) {
      const app = document.getElementById("app");
      document.title = `Page ${pageNum} - Indo-Pak Quran`;
      showLoading(`Loading Page ${pageNum}...`);

      try {
        const pageVerses = await fetchPageVerses(pageNum);

        const surahGroups = {};
        const surahIds = [];

        pageVerses.forEach(v => {
          if (!surahGroups[v.surah_id]) {
            surahGroups[v.surah_id] = [];
            surahIds.push(v.surah_id);
          }
          surahGroups[v.surah_id].push(v);
        });

        const translationPromises = surahIds.map(sId => fetchSurahTranslation(sId));
        const translationResults = await Promise.all(translationPromises);

        const pageTranslations = {};
        surahIds.forEach((sId, index) => {
          pageTranslations[sId] = translationResults[index];
        });

        let html = `
          <div class="w-full bg-gray-800 border border-sky-500/30 rounded-2xl p-6 mb-8 text-center flex items-center justify-between">
            <button ${pageNum > 1 ? `onclick="navigate('/page/${pageNum - 1}')"` : 'disabled'} class="px-3 py-1.5 bg-gray-900 border border-gray-700 hover:border-sky-500 rounded-lg text-xs font-semibold ${pageNum <= 1 ? 'opacity-40 cursor-not-allowed' : 'text-sky-400'}">
              ⬅ Previous
            </button>
            
            <div>
              <h1 class="text-2xl md:text-3xl font-extrabold text-white">Page ${pageNum}</h1>
              <p class="text-sky-400 font-medium text-xs mt-1">Page ${pageNum} of 604 (15-Line Indo-Pak Layout)</p>
            </div>

            <button ${pageNum < 604 ? `onclick="navigate('/page/${pageNum + 1}')"` : 'disabled'} class="px-3 py-1.5 bg-gray-900 border border-gray-700 hover:border-sky-500 rounded-lg text-xs font-semibold ${pageNum >= 604 ? 'opacity-40 cursor-not-allowed' : 'text-sky-400'}">
              Next ➡
            </button>
          </div>
        `;

        surahIds.forEach(sId => {
          const surahMeta = chaptersData.find(c => c.id === sId);
          const verses = surahGroups[sId];
          const translations = pageTranslations[sId];
          const isStartOfSurah = verses[0].ayah_num === 1;

          html += `
            <div class="mb-10">
              <div class="bg-gray-800/60 border border-gray-700/60 rounded-xl p-4 mb-6 flex items-center justify-between">
                <div>
                  <h2 class="text-lg font-bold text-white">${surahMeta.id}. Surah ${surahMeta.name_simple}</h2>
                  <span class="text-xs text-gray-400">${surahMeta.translated_name.name}</span>
                </div>
                <div class="font-indopak text-2xl text-sky-400" dir="rtl">${surahMeta.name_arabic}</div>
              </div>

              ${isStartOfSurah && sId !== 1 && sId !== 9 ? `
                <div class="text-center font-indopak text-2xl text-sky-400 py-3 mb-6 bg-gray-900/50 rounded-xl border border-gray-800" dir="rtl">
                  بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ
                </div>
              ` : ''}

              ${renderContent(verses, translations)}
            </div>
          `;
        });

        app.innerHTML = html;
        window.scrollTo({ top: 0, behavior: "smooth" });

      } catch (err) {
        console.error(err);
        app.innerHTML = `<div class="text-center py-20 text-red-500">Failed to load page. Please try again.</div>`;
      }
    }

    async function renderCrossSurahRange(fromSurah, fromAyah, toSurah, toAyah, customHeaderTitle = null) {
      const app = document.getElementById("app");
      const startMeta = chaptersData.find(c => c.id === fromSurah);
      const endMeta = chaptersData.find(c => c.id === toSurah);

      document.title = customHeaderTitle || `${startMeta.name_simple} (${fromAyah}) - ${endMeta.name_simple} (${toAyah}) - Range Read`;
      showLoading(`Fetching verses from ${startMeta.name_simple}:${fromAyah} to ${endMeta.name_simple}:${toAyah}...`);

      try {
        let compiledSections = [];

        for (let sId = fromSurah; sId <= toSurah; sId++) {
          const meta = chaptersData.find(c => c.id === sId);
          const [verses, translations] = await Promise.all([
            fetchChapterVerses(sId),
            fetchSurahTranslation(sId)
          ]);

          let startFilter = (sId === fromSurah) ? fromAyah : 1;
          let endFilter = (sId === toSurah) ? toAyah : meta.verses_count;

          const filtered = verses.filter(v => {
            const num = parseInt(v.verse_key.split(":")[1]);
            return num >= startFilter && num <= endFilter;
          });

          compiledSections.push({
            surahMeta: meta,
            verses: filtered,
            translations: translations,
            showBismillah: sId !== 1 && sId !== 9 && (sId !== fromSurah || fromAyah === 1)
          });
        }

        let html = `
          <div class="w-full bg-gray-800 border border-sky-500/30 rounded-2xl p-6 mb-8 text-center">
            <h1 class="text-2xl md:text-3xl font-extrabold text-white">${customHeaderTitle || 'Custom Ayah Range'}</h1>
            <p class="text-sky-400 font-medium text-sm mt-1">
              ${startMeta.name_simple} [${fromAyah}] ➔ ${endMeta.name_simple} [${toAyah}]
            </p>
          </div>
        `;

        compiledSections.forEach(section => {
          html += `
            <div class="mb-10">
              <div class="bg-gray-800/60 border border-gray-700/60 rounded-xl p-4 mb-6 flex items-center justify-between">
                <div>
                  <h2 class="text-lg font-bold text-white">${section.surahMeta.id}. Surah ${section.surahMeta.name_simple}</h2>
                  <span class="text-xs text-gray-400">${section.surahMeta.translated_name.name}</span>
                </div>
                <div class="font-indopak text-2xl text-sky-400" dir="rtl">${section.surahMeta.name_arabic}</div>
              </div>

              ${section.showBismillah ? `
                <div class="text-center font-indopak text-2xl text-sky-400 py-3 mb-6 bg-gray-900/50 rounded-xl border border-gray-800" dir="rtl">
                  بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ
                </div>
              ` : ''}

              ${renderContent(section.verses, section.translations)}
            </div>
          `;
        });

        app.innerHTML = html;
        window.scrollTo({ top: 0, behavior: "smooth" });

      } catch (err) {
        console.error(err);
        app.innerHTML = `<div class="text-center py-20 text-red-500">Failed to load range. Please try again.</div>`;
      }
    }

    async function renderJuz(juzNumber) {
      const bounds = INDOPAK_JUZ_BOUNDARIES[juzNumber];
      if (!bounds) { render404(); return; }
      const [fromS, fromA, toS, toA] = bounds;
      renderCrossSurahRange(fromS, fromA, toS, toA, `Juz (Para) ${juzNumber}`);
    }

    function renderContent(verses, translations) {
      if (displayMode === "reading-arabic") return renderReadingArabicMode(verses);
      if (displayMode === "reading-translation") return renderReadingTranslationMode(verses, translations);
      return renderVerseByVerse(verses, translations);
    }

    function renderVerseByVerse(verses, translations) {
      return `
        <div class="w-full space-y-4">
          ${verses.map(v => {
            const [surahNum, ayahNum] = v.verse_key.split(":").map(Number);
            const cleanedArabic = sanitizeArabicText(v.text_indopak);
            const ayahMarkerSvg = getAyahMarkerSvg(ayahNum);

            let translatedText = (translations && translations[ayahNum]) ? String(translations[ayahNum]) : "";

            return `
              <div id="verse-${v.verse_key}" class="w-full bg-gray-800/40 hover:bg-gray-800/70 border border-gray-800/80 hover:border-gray-700 rounded-xl p-5 md:p-8 flex flex-col space-y-4">
                <div class="flex items-center justify-between border-b border-gray-700/40 pb-3">
                  <span class="px-3 py-1 bg-sky-500/10 border border-sky-500/20 text-sky-400 text-xs font-semibold rounded-full">${v.verse_key}</span>
                  <button onclick="navigator.clipboard.writeText('${cleanedArabic.replace(/'/g, "\\'")} (${toArabicNumeral(ayahNum)})\n\n${translatedText.replace(/'/g, "\\'")}')" class="text-xs text-gray-400 hover:text-sky-400 transition">📋 Copy</button>
                </div>
                <div class="text-right indopak-text text-3xl md:text-4xl text-gray-100 px-2 pt-2 leading-relaxed">
                  ${cleanedArabic} ${ayahMarkerSvg}
                </div>
                ${translatedText ? `<div class="text-left text-sm md:text-base text-gray-300 border-t border-gray-700/40 pt-3 mt-1 leading-relaxed">${translatedText}</div>` : ''}
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderReadingArabicMode(verses) {
      let arabicParagraph = "";

      verses.forEach(v => {
        const [, ayahNum] = v.verse_key.split(":").map(Number);
        const cleanedArabic = sanitizeArabicText(v.text_indopak);
        const ayahMarkerSvg = getAyahMarkerSvg(ayahNum);
        arabicParagraph += `${cleanedArabic} ${ayahMarkerSvg} `;
      });

      return `
        <div class="w-full bg-gray-800/40 border border-gray-800/80 rounded-2xl p-4 md:p-8 my-4">
          <div class="reading-wrapper indopak-text text-3xl md:text-4xl text-gray-100 leading-[2.8] md:leading-[3.2]">${arabicParagraph}</div>
        </div>
      `;
    }

    function renderReadingTranslationMode(verses, translations) {
      let translationList = [];

      verses.forEach(v => {
        const [, ayahNum] = v.verse_key.split(":").map(Number);
        let translatedText = (translations && translations[ayahNum]) ? String(translations[ayahNum]) : "";
        if (translatedText) {
          translationList.push(`<strong class="text-sky-400">[${v.verse_key}]</strong> ${translatedText}`);
        }
      });

      return `
        <div class="w-full bg-gray-800/40 border border-gray-800/80 rounded-2xl p-6 md:p-8">
          <div class="text-left text-gray-300 text-sm md:text-base leading-relaxed space-y-3">
            ${translationList.map(t => `<p>${t}</p>`).join("")}
          </div>
        </div>
      `;
    }

    function showLoading(msg) {
      document.getElementById("app").innerHTML = `
        <div class="flex flex-col items-center justify-center py-20 space-y-4">
          <div class="w-10 h-10 border-4 border-sky-500 border-t-transparent rounded-full animate-spin"></div>
          <p class="text-gray-400 text-sm animate-pulse">${msg}</p>
        </div>
      `;
    }

    function render404() {
      document.getElementById("app").innerHTML = `
        <div class="text-center py-20">
          <h1 class="text-2xl font-bold text-red-500">View Not Found</h1>
          <a href="#/" onclick="navigate('/'); return false;" class="mt-4 inline-block text-sky-500 hover:underline">Back to Home</a>
        </div>
      `;
    }

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("displayModeSelect").value = displayMode;
      if (!window.location.hash) window.location.hash = "#/";
      else router();
    });
  </script>
</body>
</html>
