<!DOCTYPE html>
<html lang="ar" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Noble Quran - Indo-Pak Hifz Reader</title>
  
  <link rel="icon" type="image/x-icon" href="/quran-app/favicon.ico">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            theme: {
              DEFAULT: '#0284c7',
              hover: '#0369a1'
            }
          },
          fontFamily: {
            indopak: ['"Scheherazade New"', '"Noto Naskh Arabic"', '"Amiri"', 'serif'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts for Standard Indo-Pak Script & Glyph Compatibility -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Scheherazade+New:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #6b7280; border-radius: 4px; }

    /* Indo-Pak Script with Fallbacks for Waqf & Stop Symbols */
    .indopak-text {
      font-family: 'Scheherazade New', 'Noto Naskh Arabic', 'Amiri', serif;
      line-height: 2.4;
      letter-spacing: 0px;
    }

    /* Indo-Pak Ayah End Marker Styling */
    .ayah-end-symbol {
      display: inline-block;
      margin-right: 0.35rem;
      margin-left: 0.35rem;
      font-family: 'Noto Naskh Arabic', 'Scheherazade New', serif;
      color: #0284c7;
      font-weight: 600;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 dark:bg-gray-900 dark:text-gray-100 font-sans min-h-screen flex flex-col transition-colors duration-200">

  <!-- TOP HEADER & NAVIGATION TOOLBAR -->
  <header class="sticky top-0 z-50 bg-white/95 dark:bg-gray-900/95 backdrop-blur border-b border-gray-200 dark:border-gray-800 px-4 lg:px-8 py-3 flex flex-col gap-3 w-full">
    
    <div class="flex items-center justify-between w-full">
      <!-- Logo & Title -->
      <a href="#/" onclick="navigate('/'); return false;" class="flex items-center space-x-2 text-sky-600 dark:text-sky-400 font-bold text-xl tracking-wide hover:opacity-80 transition">
        <span>📖</span>
        <span>Quran Indo-Pak Hifz</span>
      </a>

      <!-- Quick Navigation Mode Tabs -->
      <div class="flex items-center space-x-2 text-xs">
        <button onclick="setNavMode('surah')" id="tabSurah" class="px-3 py-1.5 rounded-lg border border-sky-500 bg-sky-500/10 text-sky-600 dark:text-sky-400 font-semibold transition">Surah</button>
        <button onclick="setNavMode('range')" id="tabRange" class="px-3 py-1.5 rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:border-sky-500 transition">Custom Range</button>
        <button onclick="setNavMode('juz')" id="tabJuz" class="px-3 py-1.5 rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:border-sky-500 transition">Juz (Para)</button>
        <button onclick="setNavMode('page')" id="tabPage" class="px-3 py-1.5 rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:border-sky-500 transition">15-Line Page</button>
      </div>

      <!-- Dark Mode Toggle -->
      <button onclick="toggleTheme()" class="p-2 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg text-gray-700 dark:text-gray-300 transition" title="Toggle Light/Dark Mode">
        <span id="themeIcon">🌙</span>
      </button>
    </div>

    <!-- DYNAMIC CONTROLS PANEL -->
    <div class="w-full bg-gray-100/80 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700/80 rounded-xl p-2.5 flex flex-wrap items-center justify-center gap-3 text-sm">
      
      <!-- MODE 1: SINGLE SURAH SELECTOR -->
      <div id="controlsSurah" class="flex items-center space-x-2">
        <span class="text-xs text-gray-500 dark:text-gray-400">Surah:</span>
        <select id="surahSelect" onchange="if(this.value) navigate('/' + this.value)" class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 text-sm border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-sky-500">
          <option value="">Select Surah...</option>
        </select>
      </div>

      <!-- MODE 2: CROSS-SURAH AYAH RANGE SELECTOR -->
      <div id="controlsRange" class="hidden flex-wrap items-center justify-center gap-2">
        <div class="flex items-center space-x-1.5">
          <span class="text-xs text-gray-500 dark:text-gray-400">From:</span>
          <select id="startSurahSelect" onchange="updateStartAyahMax()" class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 text-xs border border-gray-300 dark:border-gray-700 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-sky-500">
            <option value="">Start Surah</option>
          </select>
          <span class="text-xs text-gray-400">:</span>
          <input type="number" id="startAyahInput" placeholder="Ayah" min="1" value="1" class="w-16 bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 text-xs border border-gray-300 dark:border-gray-700 rounded-lg px-2 py-1.5 text-center focus:outline-none focus:ring-1 focus:ring-sky-500" />
        </div>

        <span class="text-sky-500 font-bold px-1">➔</span>

        <div class="flex items-center space-x-1.5">
          <span class="text-xs text-gray-500 dark:text-gray-400">To:</span>
          <select id="endSurahSelect" onchange="updateEndAyahMax()" class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 text-xs border border-gray-300 dark:border-gray-700 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-sky-500">
            <option value="">End Surah</option>
          </select>
          <span class="text-xs text-gray-400">:</span>
          <input type="number" id="endAyahInput" placeholder="Ayah" min="1" value="1" class="w-16 bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 text-xs border border-gray-300 dark:border-gray-700 rounded-lg px-2 py-1.5 text-center focus:outline-none focus:ring-1 focus:ring-sky-500" />
        </div>

        <button onclick="applyCrossSurahRange()" class="bg-sky-500 hover:bg-sky-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold transition ml-1">
          Read Range
        </button>
      </div>

      <!-- MODE 3: JUZ SELECTOR -->
      <div id="controlsJuz" class="hidden items-center space-x-2">
        <span class="text-xs text-gray-500 dark:text-gray-400">Juz (Para):</span>
        <select id="juzSelect" onchange="if(this.value) navigate('/juz/' + this.value)" class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 text-sm border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-sky-500">
          <option value="">Select Juz (1-30)...</option>
        </select>
      </div>

      <!-- MODE 4: PAGE SELECTOR -->
      <div id="controlsPage" class="hidden items-center space-x-2">
        <span class="text-xs text-gray-500 dark:text-gray-400">15-Line Page:</span>
        <select id="pageSelect" onchange="if(this.value) navigate('/page/' + this.value)" class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 text-sm border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-sky-500">
          <option value="">Select Page (1-604)...</option>
        </select>
      </div>

    </div>
  </header>

  <!-- MAIN VIEW CONTAINER -->
  <main id="app" class="flex-1 w-full px-4 md:px-8 lg:px-16 py-6 max-w-7xl mx-auto">
    <!-- Dynamic Content -->
  </main>

  <script>
    const API_BASE = "https://api.quran.com/api/v4";
    const TRANSLATION_BASE = "https://raw.githubusercontent.com/ReflectsLight/quran-json/refs/heads/main/share/quran-json/TheNobleQuran/en";
    
    let chaptersData = [];
    const translationCache = {};

    const INDOPAK_JUZ_BOUNDARIES = {
      1:  [1, 1, 2, 141], 2:  [2, 142, 2, 252], 3:  [2, 253, 3, 91], 4:  [3, 92, 4, 23], 5:  [4, 24, 4, 147],
      6:  [4, 148, 5, 81], 7:  [5, 82, 6, 110], 8:  [6, 111, 7, 87], 9:  [7, 88, 8, 40], 10: [8, 41, 9, 93],
      11: [9, 94, 11, 5], 12: [11, 6, 12, 52], 13: [12, 53, 15, 1], 14: [15, 2, 16, 128], 15: [17, 1, 18, 74],
      16: [18, 75, 20, 135], 17: [21, 1, 22, 78], 18: [23, 1, 25, 20], 19: [25, 21, 27, 59], 20: [27, 60, 29, 44],
      21: [29, 45, 33, 30], 22: [33, 31, 36, 21], 23: [36, 22, 39, 31], 24: [39, 32, 41, 46], 25: [41, 47, 45, 37],
      26: [46, 1, 51, 30], 27: [51, 31, 57, 29], 28: [58, 1, 66, 12], 29: [67, 1, 77, 50], 30: [78, 1, 114, 6]
    };

    function toArabicNumeral(num) {
      const arabicDigits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
      return num.toString().split('').map(d => arabicDigits[d]).join('');
    }

    function navigate(path) {
      window.location.hash = path;
    }

    window.addEventListener("hashchange", router);

    async function router() {
      const hash = window.location.hash.replace('#', '') || '/';

      if (chaptersData.length === 0) {
        await loadChapters();
      }

      resetNavControls();

      if (hash === "/" || hash === "") {
        setNavMode('surah');
        renderHome();
      } else if (hash.startsWith("/range")) {
        setNavMode('range');
        const params = new URLSearchParams(hash.split("?")[1] || "");
        const fromS = parseInt(params.get("fromSurah")) || 1;
        const fromA = parseInt(params.get("fromAyah")) || 1;
        const toS = parseInt(params.get("toSurah")) || fromS;
        const toA = parseInt(params.get("toAyah")) || 1;

        document.getElementById("startSurahSelect").value = fromS;
        document.getElementById("startAyahInput").value = fromA;
        document.getElementById("endSurahSelect").value = toS;
        document.getElementById("endAyahInput").value = toA;

        renderCrossSurahRange(fromS, fromA, toS, toA);
      } else if (hash.startsWith("/juz/")) {
        setNavMode('juz');
        const juzId = parseInt(hash.split("/")[2]);
        if (juzId >= 1 && juzId <= 30) {
          document.getElementById("juzSelect").value = juzId;
          renderJuz(juzId);
        } else {
          render404();
        }
      } else if (hash.startsWith("/page/")) {
        setNavMode('page');
        const pageId = parseInt(hash.split("/")[2]);
        if (pageId >= 1 && pageId <= 604) {
          document.getElementById("pageSelect").value = pageId;
          renderPage(pageId);
        } else {
          render404();
        }
      } else {
        // Direct Surah URL pattern: /1, /2, /114
        const parts = hash.split("/");
        const id = parseInt(parts[1] || parts[0]);
        if (!isNaN(id) && id >= 1 && id <= 114) {
          setNavMode('surah');
          document.getElementById("surahSelect").value = id;
          renderSurah(id);
        } else {
          renderHome();
        }
      }
    }

    function setNavMode(mode) {
      const modes = ['surah', 'range', 'juz', 'page'];
      modes.forEach(m => {
        const tab = document.getElementById(`tab${m.charAt(0).toUpperCase() + m.slice(1)}`);
        const ctrl = document.getElementById(`controls${m.charAt(0).toUpperCase() + m.slice(1)}`);
        
        if (m === mode) {
          tab.className = "px-3 py-1.5 rounded-lg border border-sky-500 bg-sky-500/10 text-sky-600 dark:text-sky-400 font-semibold transition";
          ctrl.classList.remove("hidden");
          ctrl.classList.add("flex");
        } else {
          tab.className = "px-3 py-1.5 rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:border-sky-500 transition";
          ctrl.classList.add("hidden");
          ctrl.classList.remove("flex");
        }
      });
    }

    function resetNavControls() {
      document.getElementById("surahSelect").value = "";
      document.getElementById("juzSelect").value = "";
      document.getElementById("pageSelect").value = "";
    }

    async function loadChapters() {
      try {
        const res = await fetch(`${API_BASE}/chapters?language=en`);
        const data = await res.json();
        chaptersData = data.chapters;
        populateDropdowns();
      } catch (err) {
        console.error("Failed to fetch chapters:", err);
      }
    }

    function populateDropdowns() {
      const options = `<option value="">Select Surah...</option>` + 
        chaptersData.map(c => `<option value="${c.id}">${c.id}. ${c.name_simple} (${c.name_arabic})</option>`).join("");

      document.getElementById("surahSelect").innerHTML = options;
      document.getElementById("startSurahSelect").innerHTML = options;
      document.getElementById("endSurahSelect").innerHTML = options;

      let juzOpts = `<option value="">Select Juz...</option>`;
      for (let i = 1; i <= 30; i++) juzOpts += `<option value="${i}">Juz (Para) ${i}</option>`;
      document.getElementById("juzSelect").innerHTML = juzOpts;

      let pageOpts = `<option value="">Select Page...</option>`;
      for (let i = 1; i <= 604; i++) pageOpts += `<option value="${i}">Page ${i}</option>`;
      document.getElementById("pageSelect").innerHTML = pageOpts;
    }

    function updateStartAyahMax() {
      const sId = parseInt(document.getElementById("startSurahSelect").value);
      if (!sId) return;
      const meta = chaptersData.find(c => c.id === sId);
      document.getElementById("startAyahInput").max = meta.verses_count;
    }

    function updateEndAyahMax() {
      const sId = parseInt(document.getElementById("endSurahSelect").value);
      if (!sId) return;
      const meta = chaptersData.find(c => c.id === sId);
      document.getElementById("endAyahInput").max = meta.verses_count;
    }

    function applyCrossSurahRange() {
      const fromS = parseInt(document.getElementById("startSurahSelect").value);
      const fromA = parseInt(document.getElementById("startAyahInput").value) || 1;
      const toS = parseInt(document.getElementById("endSurahSelect").value) || fromS;
      const toA = parseInt(document.getElementById("endAyahInput").value) || 1;

      if (!fromS) {
        alert("Please select a starting Surah.");
        return;
      }

      navigate(`/range?fromSurah=${fromS}&fromAyah=${fromA}&toSurah=${toS}&toAyah=${toA}`);
    }

    async function fetchSurahTranslation(surahId) {
      if (translationCache[surahId]) return translationCache[surahId];

      try {
        const res = await fetch(`${TRANSLATION_BASE}/${surahId}.json`);
        if (!res.ok) throw new Error(`Failed to load translation: ${res.status}`);
        const data = await res.json();
        
        const map = {};
        for (let i = 1; i < data.length; i++) {
          const item = data[i];
          if (Array.isArray(item) && item.length >= 2) {
            map[item[0]] = item[1];
          }
        }

        translationCache[surahId] = map;
        return map;
      } catch (err) {
        console.error(`Error loading translation for surah ${surahId}:`, err);
        return {};
      }
    }

    async function fetchChapterVerses(surahId) {
      let allVerses = [];
      let page = 1;
      let totalPages = 1;

      while (page <= totalPages) {
        const res = await fetch(
          `${API_BASE}/verses/by_chapter/${surahId}?fields=text_indopak,text_uthmani&per_page=50&page=${page}`
        );
        if (!res.ok) throw new Error(`API Error: ${res.status}`);
        const data = await res.json();
        allVerses = allVerses.concat(data.verses);
        totalPages = data.pagination.total_pages;
        page++;
      }
      return allVerses;
    }

    function renderHome() {
      const app = document.getElementById("app");
      document.title = "The Noble Quran - Indo-Pak Hifz Reader";

      app.innerHTML = `
        <div class="mb-8 text-center max-w-2xl mx-auto py-4 space-y-2">
          <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white">The Noble Quran</h1>
          <p class="text-sky-600 dark:text-sky-400 font-medium text-xs">Indo-Pakistani Script (South Asian 15-Line Hifz Standard)</p>
          <p class="text-gray-600 dark:text-gray-400 text-xs">Read by Surah, Exact Indo-Pak Juz, 15-Line Page, or set a custom range across multiple Surahs.</p>
        </div>

        <div id="surahGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-3 w-full">
          ${chaptersData.map(c => `
            <a href="#/${c.id}" onclick="navigate('/${c.id}'); return false;" 
               class="bg-white dark:bg-gray-800/60 hover:bg-gray-50 dark:hover:bg-gray-800 border border-gray-200 dark:border-gray-700/60 hover:border-sky-500/50 p-3.5 rounded-xl transition duration-200 flex items-center justify-between group shadow-sm dark:shadow-none">
              <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-lg bg-gray-100 dark:bg-gray-900/80 border border-gray-200 dark:border-gray-700 flex items-center justify-center text-xs font-bold text-sky-600 dark:text-sky-400 group-hover:bg-sky-500 group-hover:text-white transition">
                  ${c.id}
                </div>
                <div>
                  <div class="font-semibold text-sm text-gray-900 dark:text-gray-100 group-hover:text-sky-600 dark:group-hover:text-sky-400 transition">${c.name_simple}</div>
                  <div class="text-[11px] text-gray-500 dark:text-gray-400">${c.verses_count} Verses</div>
                </div>
              </div>
              <div class="font-indopak text-lg text-gray-700 dark:text-gray-300">${c.name_arabic}</div>
            </a>
          `).join("")}
        </div>
      `;
    }

    async function renderSurah(surahId) {
      const app = document.getElementById("app");
      const surahMeta = chaptersData.find(c => c.id === surahId);
      
      document.title = `${surahMeta.name_simple} - Indo-Pak Quran`;
      showLoading(`Loading Surah ${surahMeta.name_simple}...`);

      try {
        const [verses, translations] = await Promise.all([
          fetchChapterVerses(surahId),
          fetchSurahTranslation(surahId)
        ]);

        let html = `
          <div class="w-full bg-white dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700/80 rounded-2xl p-6 mb-8 text-center relative overflow-hidden shadow-sm dark:shadow-none">
            <div class="space-y-2 relative z-10">
              <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 dark:text-white">${surahMeta.name_simple}</h1>
              <p class="text-sky-600 dark:text-sky-400 font-medium text-sm">${surahMeta.translated_name.name} • ${surahMeta.verses_count} Verses</p>
              <div class="text-3xl font-indopak text-gray-800 dark:text-gray-200 pt-1">${surahMeta.name_arabic}</div>
            </div>

            ${surahId !== 1 && surahId !== 9 ? `
              <div class="mt-6 font-indopak text-2xl md:text-3xl text-sky-600 dark:text-sky-400 border-t border-gray-200 dark:border-gray-700/60 pt-4 w-full max-w-md mx-auto" dir="rtl">
                بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ
              </div>
            ` : ''}
          </div>

          ${renderVersesList(verses, translations)}
        `;

        app.innerHTML = html;
        window.scrollTo({ top: 0, behavior: "smooth" });

      } catch (err) {
        console.error(err);
        app.innerHTML = `<div class="text-center py-20 text-red-500">Failed to load verses. Please try refreshing.</div>`;
      }
    }

    async function renderCrossSurahRange(fromSurah, fromAyah, toSurah, toAyah, customHeaderTitle = null) {
      const app = document.getElementById("app");
      
      if (fromSurah > toSurah || (fromSurah === toSurah && fromAyah > toAyah)) {
        app.innerHTML = `<div class="text-center py-20 text-amber-500 font-semibold">Invalid range. Start point must be before end point.</div>`;
        return;
      }

      const startMeta = chaptersData.find(c => c.id === fromSurah);
      const endMeta = chaptersData.find(c => c.id === toSurah);

      document.title = customHeaderTitle || `${startMeta.name_simple} (${fromAyah}) - ${endMeta.name_simple} (${toAyah}) - Range Read`;
      showLoading(`Fetching verses from ${startMeta.name_simple}:${fromAyah} to ${endMeta.name_simple}:${toAyah}...`);

      try {
        let compiledSections = [];

        for (let sId = fromSurah; sId <= toSurah; sId++) {
          const meta = chaptersData.find(c => c.id === sId);
          const [verses, translations] = await Promise.all([
            fetchChapterVerses(sId),
            fetchSurahTranslation(sId)
          ]);

          let startFilter = 1;
          let endFilter = meta.verses_count;

          if (sId === fromSurah) startFilter = fromAyah;
          if (sId === toSurah) endFilter = toAyah;

          const filtered = verses.filter(v => {
            const num = parseInt(v.verse_key.split(":")[1]);
            return num >= startFilter && num <= endFilter;
          });

          compiledSections.push({
            surahMeta: meta,
            verses: filtered,
            translations: translations,
            isStartSection: sId === fromSurah,
            showBismillah: sId !== 1 && sId !== 9 && (sId !== fromSurah || fromAyah === 1)
          });
        }

        let html = `
          <div class="w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-sky-500/30 rounded-2xl p-6 mb-8 text-center shadow-sm dark:shadow-none">
            <h1 class="text-2xl md:text-3xl font-extrabold text-gray-900 dark:text-white">${customHeaderTitle || 'Custom Ayah Range'}</h1>
            <p class="text-sky-600 dark:text-sky-400 font-medium text-sm mt-1">
              ${startMeta.name_simple} [${fromAyah}] ➔ ${endMeta.name_simple} [${toAyah}]
            </p>
          </div>
        `;

        compiledSections.forEach(section => {
          html += `
            <div class="mb-10">
              <div class="bg-gray-100 dark:bg-gray-800/60 border border-gray-200 dark:border-gray-700/60 rounded-xl p-4 mb-6 flex items-center justify-between">
                <div>
                  <h2 class="text-lg font-bold text-gray-900 dark:text-white">${section.surahMeta.id}. Surah ${section.surahMeta.name_simple}</h2>
                  <span class="text-xs text-gray-500 dark:text-gray-400">${section.surahMeta.translated_name.name}</span>
                </div>
                <div class="font-indopak text-2xl text-sky-600 dark:text-sky-400">${section.surahMeta.name_arabic}</div>
              </div>

              ${section.showBismillah ? `
                <div class="text-center font-indopak text-2xl text-sky-600 dark:text-sky-400 py-3 mb-6 bg-white dark:bg-gray-900/50 rounded-xl border border-gray-200 dark:border-gray-800" dir="rtl">
                  بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ
                </div>
              ` : ''}

              ${renderVersesList(section.verses, section.translations)}
            </div>
          `;
        });

        app.innerHTML = html;
        window.scrollTo({ top: 0, behavior: "smooth" });

      } catch (err) {
        console.error(err);
        app.innerHTML = `<div class="text-center py-20 text-red-500">Failed to load range. Please try again.</div>`;
      }
    }

    async function renderJuz(juzNumber) {
      const bounds = INDOPAK_JUZ_BOUNDARIES[juzNumber];
      if (!bounds) {
        render404();
        return;
      }

      const [fromS, fromA, toS, toA] = bounds;
      renderCrossSurahRange(fromS, fromA, toS, toA, `Juz (Para) ${juzNumber}`);
    }

    async function renderPage(pageNumber) {
      const app = document.getElementById("app");
      document.title = `Page ${pageNumber} - Indo-Pak Hifz`;
      showLoading(`Loading Page ${pageNumber}...`);

      try {
        const res = await fetch(`${API_BASE}/verses/by_page/${pageNumber}?fields=text_indopak,text_uthmani&per_page=50`);
        if (!res.ok) throw new Error(`API error: ${res.status}`);
        
        const data = await res.json();
        const verses = data.verses;

        const uniqueSurahs = [...new Set(verses.map(v => parseInt(v.verse_key.split(":")[0])))];
        const translationMaps = {};
        
        await Promise.all(uniqueSurahs.map(async sId => {
          translationMaps[sId] = await fetchSurahTranslation(sId);
        }));

        const prevPage = pageNumber > 1 ? pageNumber - 1 : null;
        const nextPage = pageNumber < 604 ? pageNumber + 1 : null;

        let html = `
          <div class="w-full bg-white dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700/80 rounded-2xl p-4 md:p-6 mb-8 flex items-center justify-between shadow-sm dark:shadow-none">
            ${prevPage ? `
              <a href="#/page/${prevPage}" onclick="navigate('/page/${prevPage}'); return false;" class="px-3 py-1.5 bg-gray-100 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 hover:border-sky-500 text-xs md:text-sm font-semibold rounded-lg text-sky-600 dark:text-sky-400 transition">
                ← Page ${prevPage}
              </a>
            ` : '<div></div>'}

            <div class="text-center">
              <h1 class="text-2xl md:text-3xl font-extrabold text-gray-900 dark:text-white">Page ${pageNumber}</h1>
              <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">15-Line Hifz Mushaf Print Standard</p>
            </div>

            ${nextPage ? `
              <a href="#/page/${nextPage}" onclick="navigate('/page/${nextPage}'); return false;" class="px-3 py-1.5 bg-gray-100 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 hover:border-sky-500 text-xs md:text-sm font-semibold rounded-lg text-sky-600 dark:text-sky-400 transition">
                Page ${nextPage} →
              </a>
            ` : '<div></div>'}
          </div>

          ${renderVersesList(verses, translationMaps)}
        `;

        app.innerHTML = html;
        window.scrollTo({ top: 0, behavior: "smooth" });

      } catch (err) {
        console.error(err);
        app.innerHTML = `<div class="text-center py-20 text-red-500">Failed to load Page ${pageNumber}.</div>`;
      }
    }

    function renderVersesList(verses, translations) {
      return `
        <div class="w-full space-y-4">
          ${verses.map(v => {
            const [surahNum, ayahNum] = v.verse_key.split(":").map(Number);
            let arabicText = v.text_indopak || v.text_uthmani;
            
            // Clean duplicate end symbols if present in API payload
            arabicText = arabicText.replace(/[\u06DD\u06D4]/g, '').trim();

            const ayahMarker = `<span class="ayah-end-symbol">۝${toArabicNumeral(ayahNum)}</span>`;
            
            let translatedText = "";
            if (translations[surahNum] && typeof translations[surahNum] === 'object' && !translations[ayahNum]) {
              translatedText = translations[surahNum][ayahNum] || "";
            } else {
              translatedText = translations[ayahNum] || "";
            }

            return `
              <div id="verse-${v.verse_key}" class="w-full bg-white dark:bg-gray-800/40 hover:bg-gray-50 dark:hover:bg-gray-800/70 border border-gray-200 dark:border-gray-800/80 hover:border-gray-300 dark:hover:border-gray-700 rounded-xl p-5 md:p-8 transition duration-150 flex flex-col space-y-4 shadow-sm dark:shadow-none">
                
                <div class="flex items-center justify-between border-b border-gray-100 dark:border-gray-700/40 pb-3">
                  <span class="px-3 py-1 bg-sky-500/10 border border-sky-500/20 text-sky-600 dark:text-sky-400 text-xs font-semibold rounded-full">
                    ${v.verse_key}
                  </span>

                  <button onclick="navigator.clipboard.writeText('${arabicText.replace(/'/g, "\\'")} ${toArabicNumeral(ayahNum)}\\n\\n${translatedText.replace(/'/g, "\\'")}')" class="text-xs text-gray-500 dark:text-gray-400 hover:text-sky-600 dark:hover:text-sky-400 transition">
                    📋 Copy Verse & Translation
                  </button>
                </div>

                <div class="text-right indopak-text text-3xl md:text-4xl text-gray-900 dark:text-gray-100 px-2 pt-2" dir="rtl">
                  ${arabicText} ${ayahMarker}
                </div>

                ${translatedText ? `
                  <div class="text-left text-sm md:text-base text-gray-700 dark:text-gray-300 border-t border-gray-100 dark:border-gray-700/40 pt-3 mt-1 leading-relaxed">
                    ${translatedText}
                  </div>
                ` : ''}

              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function showLoading(msg) {
      document.getElementById("app").innerHTML = `
        <div class="flex flex-col items-center justify-center py-20 space-y-4">
          <div class="w-10 h-10 border-4 border-sky-500 border-t-transparent rounded-full animate-spin"></div>
          <p class="text-gray-500 dark:text-gray-400 text-sm animate-pulse">${msg}</p>
        </div>
      `;
    }

    function render404() {
      document.getElementById("app").innerHTML = `
        <div class="text-center py-20">
          <h1 class="text-2xl font-bold text-red-500">View Not Found</h1>
          <a href="#/" onclick="navigate('/'); return false;" class="mt-4 inline-block text-sky-500 hover:underline">Back to Home</a>
        </div>
      `;
    }

    function toggleTheme() {
      const html = document.documentElement;
      const icon = document.getElementById("themeIcon");
      if (html.classList.contains("dark")) {
        html.classList.remove("dark");
        document.body.classList.replace("bg-gray-900", "bg-gray-50");
        document.body.classList.replace("text-gray-100", "text-gray-900");
        icon.innerText = "☀️";
      } else {
        html.classList.add("dark");
        document.body.classList.replace("bg-gray-50", "bg-gray-900");
        document.body.classList.replace("text-gray-900", "text-gray-100");
        icon.innerText = "🌙";
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      if (!window.location.hash) {
        window.location.hash = "#/";
      } else {
        router();
      }
    });
  </script>
</body>
</html>
